---
apiVersion: svc.dpu.nvidia.com/v1alpha1
kind: DPUDeployment
metadata:
  name: doca-weave
  namespace: dpf-operator-system
spec:
  dpus:
    astraEnabled: true
    blueFieldSoftware: bfsw-xplane-weave
    # flavor should match your specific underlay topology.
    flavor: flavor-xplane-weave
    nodeEffect:
      noEffect: true
    dpuSets:
    - nameSuffix: "dpuset1"
      dpuNodeSelector:
        matchLabels:
          feature.node.kubernetes.io/dpu-enabled: "true"
  services:
    weave-flow-controller:
      serviceTemplate: weave-flow-controller
      serviceConfiguration: weave-flow-controller
    weave-dhcp-agent:
      serviceTemplate: weave-dhcp-agent
      serviceConfiguration: weave-dhcp-agent
  # serviceChains: define per XPLANE / PF based on your underlay topology.
