{{ include "validate" . }}
{{- if .Values.host.snapController.enabled }}
{{- $_ := required "host.snapController.config.dpuClusterSecret must be set" .Values.host.snapController.config.dpuClusterSecret }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "snap-controller.fullname" . }}-controller
  labels:
    {{- include "snap-controller.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "snap-controller.selectorLabels" . | nindent 6 }}
  replicas: {{ .Values.host.snapController.replicas }}
  template:
    metadata:
      labels:
        {{- include "snap-controller.selectorLabels" . | nindent 8 }}
        {{- with .Values.host.snapController.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- toYaml .Values.host.snapController.podAnnotations | nindent 8 }}
    spec:
      {{- with .Values.host.snapController.imagePullSecrets | default .Values.imagePullSecrets}}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.host.snapController.podSecurityContext | nindent 8 }}
      containers:
        - name: controller
          image: "{{ .Values.host.snapController.image.repository }}:{{ .Values.host.snapController.image.tag | default .Chart.AppVersion }}"
          command:
          - /snap-controller
          args:
           - --config-namespace={{ .Values.host.snapController.config.configNamespace | default .Release.Namespace }}
          env:
          - name: KUBERNETES_SERVICE_HOST
            valueFrom:
              secretKeyRef:
                name: "{{ .Values.host.snapController.config.dpuClusterSecret }}"
                key: KUBERNETES_SERVICE_HOST
          - name: KUBERNETES_SERVICE_PORT
            valueFrom:
              secretKeyRef:
                name: "{{ .Values.host.snapController.config.dpuClusterSecret }}"
                key: KUBERNETES_SERVICE_PORT
          imagePullPolicy: {{ .Values.host.snapController.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.host.snapController.securityContext | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.host.snapController.resources | nindent 12 }}
          volumeMounts:
          - name: tokenfile
            mountPath: "/var/run/secrets/kubernetes.io/serviceaccount"
            readOnly: true
      volumes:
      - name: tokenfile
        projected:
          sources:
          - secret:
              name: "{{ .Values.host.snapController.config.dpuClusterSecret }}"
              items:
              - key: TOKEN_FILE
                path: token
          - secret:
              name: "{{ .Values.host.snapController.config.dpuClusterSecret }}"
              items:
              - key: KUBERNETES_CA_DATA
                path: ca.crt
      terminationGracePeriodSeconds: 10
      {{- with .Values.host.snapController.nodeSelector | default dict }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.host.snapController.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.host.snapController.tolerations | default list }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
