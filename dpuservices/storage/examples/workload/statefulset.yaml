---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nvidia-storage-test
spec:
  serviceName: "nvidia-storage-test"
  podManagementPolicy: "Parallel"
  replicas: 1
  selector:
    matchLabels:
      app: nvidia-storage-test
  template:
    metadata:
      labels:
        app: nvidia-storage-test
    spec:
      containers:
      - name: nvidia-storage-test
        image: registry.k8s.io/nginx-slim:0.21
        volumeDevices:
          - name: vol1
            devicePath: /dev/xvda
          - name: vol2
            devicePath: /dev/xvdb
  volumeClaimTemplates:
  - metadata:
      name: vol1
    spec:
      accessModes: [ "ReadWriteOnce" ]
      volumeMode: Block
      storageClassName: snap
      resources:
        requests:
          storage: 1Gi
  - metadata:
      name: vol2
    spec:
      accessModes: [ "ReadWriteOnce" ]
      volumeMode: Block
      storageClassName: snap
      resources:
        requests:
          storage: 2Gi
