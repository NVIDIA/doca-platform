version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - importas
    - ineffassign
    - misspell
    - nakedret
    - prealloc
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    ginkgolinter:
      forbid-focus-container: true
    goconst:
      ignore-tests: true
      exclude-types:
        - Call
        - CompositeLit
    importas:
      alias:
        # DPF
        - pkg: github.com/nvidia/doca-platform/api/operator/v1alpha1
          alias: operatorv1
        - pkg: github.com/nvidia/doca-platform/api/controlplane/v1alpha1
          alias: controlplanev1
        - pkg: github.com/nvidia/doca-platform/api/dpuservice/v1alpha1
          alias: dpuservicev1
        - pkg: github.com/nvidia/doca-platform/internal/operator/controllers
          alias: operatorcontroller
        - pkg: github.com/nvidia/doca-platform/internal/servicechainset/controllers
          alias: sfcsetcontroller
        - pkg: github.com/nvidia/doca-platform/internal/dpuservice/controllers
          alias: dpuservicecontroller
        - pkg: github.com/nvidia/doca-platform/internal/controlplane/metadata
          alias: controlplanemeta
        - pkg: github.com/nvidia/doca-platform/api/provisioning/v1alpha1
          alias: provisioningv1
        - pkg: github.com/nvidia/doca-platform/api/vpc/v1alpha1
          alias: vpcv1
        # Kubernetes
        - pkg: k8s.io/api/core/v1
          alias: corev1
        - pkg: k8s.io/api/apps/v1
          alias: appsv1
        - pkg: k8s.io/apimachinery/pkg/apis/meta/v1
          alias: metav1
        - pkg: k8s.io/apimachinery/pkg/api/errors
          alias: apierrors
        - pkg: k8s.io/apimachinery/pkg/util/errors
          alias: kerrors
        - pkg: k8s.io/component-base/logs/api/v1
          alias: logsv1
        - pkg: k8s.io/utils/exec
          alias: kexec
        - pkg: k8s.io/api/admissionregistration/v1
          alias: admissionregistrationv1
        - pkg: k8s.io/api/batch/v1
          alias: batchv1
        # Third party APIs
        - pkg: github.com/nvidia/doca-platform/third_party/api/nvipam/api/v1alpha1
          alias: nvipamv1
        - pkg: github.com/nvidia/doca-platform/third_party/forked/github.com/clastix/kamaji/api/v1alpha1
          alias: kamajiv1
        - pkg: github.com/nvidia/doca-platform/third_party/forked/argoproj/argo-cd/pkg/apis/application/v1alpha1
          alias: argov1
        # Controller Runtime
        - pkg: sigs.k8s.io/controller-runtime
          alias: ctrl
      no-unaliased: true
    misspell:
      locale: US
      ignore-rules:
        - flavour
    staticcheck:
      checks:
        - all
      dot-import-whitelist:
        - github.com/onsi/ginkgo/v2
        - github.com/onsi/gomega
  exclusions:
    generated: lax
    rules:
      - linters:
          - dupl
        path: _test\.go
      - linters:
          - goconst
        # test/e2e files aren't named _test.go (so goconst's own ignore-tests setting doesn't cover
        # them), but they're still e2e test code where repeated literal fixture values are normal.
        path: "^test/e2e/"
      - linters:
          - staticcheck
        text: "ST1000"
      - linters:
          - staticcheck
        text: "QF1008"
      - linters:
          - staticcheck
        # corev1.Endpoints and related types are needed for DPUService reconciliation. Ignore warnings that they're deprecated.
        text: "SA1019: k8s\\.io/api/core/v1\\.Endpoint.*is deprecated"
      - linters:
          - staticcheck
        # ProvisioningInstallInterface.installViaGNOI is deprecated; validation still accepts it until configs migrate to installViaHostAgent.
        text: "SA1019.*InstallViaGNOI.*deprecated"
      - linters:
          - staticcheck
        # RollingUpdateDPU.MaxUnavailable is deprecated and slated for removal in v27.1.0; still supported until callers migrate.
        text: "SA1019: .*\\.MaxUnavailable is deprecated"
      - linters:
          - staticcheck
        # DPUFlavor/related NodeDMSAddress field is deprecated (no longer used) but kept for compatibility with existing configs.
        text: "SA1019: .*\\.NodeDMSAddress is deprecated"
      - linters:
          - staticcheck
        # GNOI field is deprecated in favor of HostAgent; still accepted until configs migrate.
        text: "SA1019: .*\\.GNOI is deprecated"
      - linters:
          - staticcheck
        # DPUSet/DPUSetSpec.DPUSelector is deprecated in favor of DPUDeviceSelector but still supported until v27.1.0.
        text: "SA1019: .*\\.DPUSelector is deprecated"
      - linters:
          - staticcheck
        # Exclusions field is deprecated in favor of ExcludeRanges but still supported until v26.10.0.
        text: "SA1019: .*\\.Exclusions is deprecated"
      - linters:
          - staticcheck
        # BFBRegistryAddress is deprecated in favor of RegistryConfiguration but still supported until configs migrate.
        text: "SA1019: .*\\.BFBRegistryAddress is deprecated"
      - linters:
          - staticcheck
        # DPUDeviceSpec.OPN is deprecated in favor of status.opn but the spec field remains for immutability validation.
        text: "SA1019: .*\\.OPN is deprecated"
      - linters:
          - staticcheck
        # NodeSelector is deprecated in favor of DPUNodeSelector but still supported until v27.1.0.
        text: "SA1019: .*\\.NodeSelector is deprecated"
      - linters:
          - staticcheck
        # Images is deprecated in favor of the cni/daemon fields but still supported until v27.1.0.
        text: "SA1019: .*\\.Images is deprecated"
      - linters:
          - staticcheck
        # DPUDeviceSpec.PSID is deprecated in favor of status.psid but the spec field remains for immutability validation.
        text: "SA1019: .*\\.PSID is deprecated"
      - linters:
          - staticcheck
        # Forked kamaji KubeletSpec.CGroupFS is deprecated upstream in favor of ConfigurationJSONPatches; still set for compatibility.
        text: "SA1019: .*\\.CGroupFS is deprecated"
      - linters:
          - staticcheck
        # DPUSpec.BMCIP is deprecated in favor of DPUDevice's BMCIP but still supported until callers migrate.
        text: "SA1019: .*\\.BMCIP is deprecated"
      - linters:
          - staticcheck
        # BFBRegistry is deprecated in favor of RegistryConfiguration but still supported until configs migrate.
        text: "SA1019: .*\\.BFBRegistry is deprecated"
    paths:
      - third_party
      - third_party$
      # SFC CNI code was recently moved out of third_party/forked/ovs-cni into the
      # main module. The upstream code has style/complexity issues that the
      # original third_party exclusion was hiding. The exclusion is intentionally
      # temporary, follow-up PRs will clean these up and remove these entries.
      # TODO: Remove once the upstream code is cleaned up.
      - internal/cni/dpf-ovs-cni
      - cmd/dpf-ovs-cni
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gci
    - gofmt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - prefix(github.com/nvidia/doca-platform)
        - default
      custom-order: true
  exclusions:
    # Exclude vendored directories from linting.
    generated: lax
    paths:
      - third_party
      - third_party$
      # TODO: Remove once the upstream code is cleaned up.
      - internal/cni/dpf-ovs-cni
      - cmd/dpf-ovs-cni
