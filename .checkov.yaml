checks: # Will get used as comma separated list for the --check flag of checkov
- CKV_K8S_8 # Liveness Probe Should be Configured
- CKV_K8S_9  # Readiness Probe Should be Configured
- CKV_K8S_11 # CPU limits should be set
- CKV_K8S_13 # Memory limits should be set
- CKV_K8S_15 # Image Pull Policy should be Always
- CKV_K8S_29 # Apply security context to your pods and containers
- CKV_K8S_35 # Prefer using secrets as files over secrets as environment variables
- CKV_K8S_38 # Ensure that Service Account Tokens are only mounted where necessary
- CKV_K8S_40 # Containers should run as a high UID to avoid host conflict
- CKV_K8S_43 # Image should use digest
- CKV_K8S_49 # Minimize wildcard use in Roles and ClusterRoles

exclusions: # Is used to define exclusions on a per-chart basis when analyzing a report via `dpfdev checkov`.

  dpf-operator: []

  dpu-networking-flannel:
  # The upstream chart does not allow to set resource limits for init containers.
  - check_id: CKV_K8S_11 # CPU limits should be set
    resource: DaemonSet.default.kube-flannel-ds
    evaluated_keys:
      - spec/template/spec/initContainers/[0]/resources/limits/cpu
  - check_id: CKV_K8S_13 # Memory limits should be set
    resource: DaemonSet.default.kube-flannel-ds
    evaluated_keys:
      - spec/template/spec/initContainers/[0]/resources/limits/memory
  # Flannel requires the API and the upstream chart does not allow to modify this.
  - check_id: CKV_K8S_38 # Ensure that Service Account Tokens are only mounted where necessary
    resource: DaemonSet.default.kube-flannel-ds
  # Flannel requires to run with high privileges
  - check_id: CKV_K8S_29 # Apply security context to your pods and containers
    resource: DaemonSet.default.kube-flannel-ds
  - check_id: CKV_K8S_40 # Containers should run as a high UID to avoid host conflict
    resource: DaemonSet.default.kube-flannel-ds
  # Flannel does not provide a liveness or readiness probe.
  - check_id: CKV_K8S_8 # Liveness Probe Should be Configured
    resource: DaemonSet.default.kube-flannel-ds
    evaluated_keys:
      - spec/template/spec/containers/[0]/livenessProbe
  - check_id: CKV_K8S_9 # Readiness Probe Should be Configured
    resource: DaemonSet.default.kube-flannel-ds
    evaluated_keys:
      - spec/template/spec/containers/[0]/readinessProbe

  dpu-networking-multus:
  # multus does not provide a liveness or readiness probe.
  - check_id: CKV_K8S_8 # Liveness Probe Should be Configured
    resource: DaemonSet.default.kube-multus-ds
    evaluated_keys:
      - spec/template/spec/containers/[0]/livenessProbe
  - check_id: CKV_K8S_9 # Readiness Probe Should be Configured
    resource: DaemonSet.default.kube-multus-ds
    evaluated_keys:
      - spec/template/spec/containers/[0]/readinessProbe
  # multus requires the API.
  - check_id: CKV_K8S_38 # Ensure that Service Account Tokens are only mounted where necessary
    resource: DaemonSet.default.kube-multus-ds
  # multus is required to run as root.
  - check_id: CKV_K8S_40 # Containers should run as a high UID to avoid host conflict
    resource: DaemonSet.default.kube-multus-ds

  dpu-networking-sriov-device-plugin:
  # sriov-device-plugin is required to run as root.
  - check_id: CKV_K8S_40 # Containers should run as a high UID to avoid host conflict
    resource: DaemonSet.default.kube-sriov-device-plugin
  # sriov-device-plugin does not provide a liveness or readiness probe.
  - check_id: CKV_K8S_8 # Liveness Probe Should be Configured
    resource: DaemonSet.default.kube-sriov-device-plugin
    evaluated_keys:
      - spec/template/spec/containers/[0]/livenessProbe
  - check_id: CKV_K8S_9 # Readiness Probe Should be Configured
    resource: DaemonSet.default.kube-sriov-device-plugin
    evaluated_keys:
      - spec/template/spec/containers/[0]/readinessProbe

  dpu-networking-nvidia-k8s-ipam:
  # Daemonset has to run as root.
  - check_id: CKV_K8S_40 # Containers should run as a high UID to avoid host conflict
    resource: DaemonSet.default.release-name-nvidia-k8s-ipam-node-ds
  # Deployment has to run as user 1000.
  - check_id: CKV_K8S_40 # Containers should run as a high UID to avoid host conflict
    resource: Deployment.default.release-name-nvidia-k8s-ipam
  # Daemonset does not provide a liveness or readiness probe.
  - check_id: CKV_K8S_8 # Liveness Probe Should be Configured
    resource: DaemonSet.default.release-name-nvidia-k8s-ipam-node-ds
    evaluated_keys:
      - spec/template/spec/containers/[0]/livenessProbe
  - check_id: CKV_K8S_9 # Readiness Probe Should be Configured
    resource: DaemonSet.default.release-name-nvidia-k8s-ipam-node-ds
    evaluated_keys:
      - spec/template/spec/containers/[0]/readinessProbe

  dpu-networking-ovs-cni:
  # Digest can be set via values.
  - check_id: CKV_K8S_15 # Image Pull Policy should be Always
    resource: DaemonSet.default.release-name-ovs-cni-arm64
    evaluated_keys:
      - spec/template/spec/containers/[0]/image
      - spec/template/spec/containers/[0]/imagePullPolicy
  - check_id: CKV_K8S_43 # Image should use digest
    resource: DaemonSet.default.release-name-ovs-cni-arm64
    evaluated_keys:
      - spec/template/spec/containers/[0]/image
  # ovs-cni requires the API.
  - check_id: CKV_K8S_38 # Ensure that Service Account Tokens are only mounted where necessary
    resource: DaemonSet.default.release-name-ovs-cni-arm64
  # ovs-cni needs to run as root.
  - check_id: CKV_K8S_40 # Containers should run as a high UID to avoid host conflict
    resource: DaemonSet.default.release-name-ovs-cni-arm64

  dpu-networking-sfc-controller:
  # Digest can be set via values.
  - check_id: CKV_K8S_15 # Image Pull Policy should be Always
    resource: DaemonSet.default.release-name-node-ds
    evaluated_keys:
      - spec/template/spec/containers/[0]/image
      - spec/template/spec/containers/[0]/imagePullPolicy
  - check_id: CKV_K8S_43 # Image should use digest
    resource: DaemonSet.default.release-name-node-ds
    evaluated_keys:
      - spec/template/spec/containers/[0]/image
  #  sfc-controller daemonset needs to run as root.
  - check_id: CKV_K8S_40 # Containers should run as a high UID to avoid host conflict
    resource: DaemonSet.default.release-name-node-ds

  dpu-networking-cni-installer:
  # Digest can be set via values.
  - check_id: CKV_K8S_15 # Image Pull Policy should be Always
    resource: DaemonSet.default.release-name
    evaluated_keys:
      - spec/template/spec/containers/[0]/image
      - spec/template/spec/containers/[0]/imagePullPolicy
  - check_id: CKV_K8S_43 # Image should use digest
    resource: DaemonSet.default.release-name
    evaluated_keys:
      - spec/template/spec/containers/[0]/image
  # cni-installer needs to run as root.
  - check_id: CKV_K8S_40 # Containers should run as a high UID to avoid host conflict
    resource: DaemonSet.default.release-name
  # Daemonset does not provide a liveness or readiness probe.
  - check_id: CKV_K8S_8 # Liveness Probe Should be Configured
    resource: DaemonSet.default.release-name
    evaluated_keys:
      - spec/template/spec/containers/[0]/livenessProbe
  - check_id: CKV_K8S_9 # Readiness Probe Should be Configured
    resource: DaemonSet.default.release-name
    evaluated_keys:
      - spec/template/spec/containers/[0]/readinessProbe

  dpu-networking-node-problem-detector:
  # Node Problem Detector requires root access to read kernel logs and system state
  - check_id: CKV_K8S_40 # Containers should run as a high UID to avoid host conflict
    resource: DaemonSet.default.release-name-node-problem-detector

  dpu-networking-opentelemetry-collector:
  # Container needs to run as root to read logs from hostPath.
  - check_id: CKV_K8S_40 # Containers should run as a high UID to avoid host conflict
    resource: DaemonSet.default.release-name-opentelemetry-collector

  kamaji-keepalived:
  # Keepalived does not provide liveness or readiness probes.
  - check_id: CKV_K8S_8 # Liveness Probe Should be Configured
    resource: DaemonSet.default.placeholder
    evaluated_keys:
      - spec/template/spec/containers/[0]/livenessProbe
  - check_id: CKV_K8S_9 # Readiness Probe Should be Configured
    resource: DaemonSet.default.placeholder
    evaluated_keys:
      - spec/template/spec/containers/[0]/readinessProbe
  # Keepalived does not need much CPU resources, but setting a limit requires proper data.
  - check_id: CKV_K8S_11 # CPU limits should be set
    resource: DaemonSet.default.placeholder
    evaluated_keys:
      - spec/template/spec/containers/[0]/resources/limits/cpu
  # Keepalived does need to run as root for low-level networking operations
  - check_id: CKV_K8S_40 # Containers should run as a high UID to avoid host conflict
    resource: DaemonSet.default.placeholder
  # TODO: Research if a image with digest can be configured.
  - check_id: CKV_K8S_15 # Image Pull Policy should be Always
    resource: DaemonSet.default.placeholder
    evaluated_keys:
      - spec/template/spec/containers/[0]/image
      - spec/template/spec/containers/[0]/imagePullPolicy
  - check_id: CKV_K8S_43 # Image should use digest
    resource: DaemonSet.default.placeholder
    evaluated_keys:
      - spec/template/spec/containers/[0]/image

  # Exclusions for manifests embedded in the dpf-operator binary.
  ## Note: checkov is not aware of our CRDs like DPUService, ... so these need to be scanned separately.

  dpu-detector:
  # The process does not provide a liveness or readiness probe.
  - check_id: CKV_K8S_8 # Liveness Probe Should be Configured
    resource: DaemonSet.default.dpf-dpu-detector
    evaluated_keys:
      - spec/template/spec/containers/[0]/livenessProbe
  - check_id: CKV_K8S_9 # Readiness Probe Should be Configured
    resource: DaemonSet.default.dpf-dpu-detector
    evaluated_keys:
      - spec/template/spec/containers/[0]/readinessProbe
  # Note: This is required as the NFD features file is in /etc/kubernetes
  # TODO: This should be changed to a normal user-writable directory
  - check_id: CKV_K8S_40 # Containers should run as a high UID to avoid host conflict
    resource: DaemonSet.default.dpf-dpu-detector
  # Should be set to image with digest via DPFOperatorConfig.
  - check_id: CKV_K8S_15 # Image Pull Policy should be Always
    resource: DaemonSet.default.dpf-dpu-detector
    evaluated_keys:
      - spec/template/spec/containers/[0]/image
      - spec/template/spec/containers/[0]/imagePullPolicy
  - check_id: CKV_K8S_43 # Image should use digest
    resource: DaemonSet.default.dpf-dpu-detector
    evaluated_keys:
      - spec/template/spec/containers/[0]/image

  dpuservice-controller:
  # Should be set to image with digest via DPFOperatorConfig.
  - check_id: CKV_K8S_15 # Image Pull Policy should be Always
    resource: Deployment.dpuservice-controller-system.dpuservice-controller-manager
    evaluated_keys:
      - spec/template/spec/containers/[0]/image
      - spec/template/spec/containers/[0]/imagePullPolicy
  - check_id: CKV_K8S_43 # Image should use digest
    resource: Deployment.dpuservice-controller-system.dpuservice-controller-manager
    evaluated_keys:
      - spec/template/spec/containers/[0]/image
  # TODO: Fix these findings or document the exclusion properly.
  - check_id: CKV_K8S_11 # CPU limits should be set
    resource: Deployment.dpuservice-controller-system.dpuservice-controller-manager
    evaluated_keys:
      - spec/template/spec/containers/[0]/resources/limits/cpu
  - check_id: CKV_K8S_13 # Memory limits should be set
    resource: Deployment.dpuservice-controller-system.dpuservice-controller-manager
    evaluated_keys:
      - spec/template/spec/containers/[0]/resources/limits/memory

  kamaji-cluster-manager:
  # Should be set to image with digest via DPFOperatorConfig.
  - check_id: CKV_K8S_15 # Image Pull Policy should be Always
    resource: Deployment.dpf-operator-system.kamaji-cm-controller-manager
    evaluated_keys:
      - spec/template/spec/containers/[0]/image
      - spec/template/spec/containers/[0]/imagePullPolicy
  - check_id: CKV_K8S_43 # Image should use digest
    resource: Deployment.dpf-operator-system.kamaji-cm-controller-manager
    evaluated_keys:
      - spec/template/spec/containers/[0]/image

  provisioning-controller:
  # No pod-level securityContext so the init container can run as root to create the hostPath directory.
  - check_id: CKV_K8S_29 # Apply security context to your pods and containers
    resource: Deployment.dpf-provisioning.dpf-provisioning-controller-manager
  # Should be set to image with digest via DPFOperatorConfig.
  - check_id: CKV_K8S_15 # Image Pull Policy should be Always
    resource: Deployment.dpf-provisioning.dpf-provisioning-controller-manager
    evaluated_keys:
      - spec/template/spec/containers/[0]/image
      - spec/template/spec/containers/[0]/imagePullPolicy
  - check_id: CKV_K8S_43 # Image should use digest
    resource: Deployment.dpf-provisioning.dpf-provisioning-controller-manager
    evaluated_keys:
      - spec/template/spec/containers/[0]/image

  static-cluster-manager:
  # Should be set to image with digest via DPFOperatorConfig.
  - check_id: CKV_K8S_15 # Image Pull Policy should be Always
    resource: Deployment.dpf-operator-system.static-cm-controller-manager
    evaluated_keys:
      - spec/template/spec/containers/[0]/image
      - spec/template/spec/containers/[0]/imagePullPolicy
  - check_id: CKV_K8S_43 # Image should use digest
    resource: Deployment.dpf-operator-system.static-cm-controller-manager
    evaluated_keys:
      - spec/template/spec/containers/[0]/image

  ## VPC chart components

  vpc-ovn-host: []

  vpc-ovn-dpu:
  # Components need to run as root e.g. for socket access.
  - check_id: CKV_K8S_40 # Containers should run as a high UID to avoid host conflict
    resource: DaemonSet.default.release-name-vpc-ovn-node
  # dhcp-cni-daemon does not provide a liviness or readiness probe.
  - check_id: CKV_K8S_8 # Liveness Probe Should be Configured
    resource: DaemonSet.default.release-name-vpc-ovn-node
    evaluated_keys:
      - spec/template/spec/containers/[1]/livenessProbe
  - check_id: CKV_K8S_9 # Readiness Probe Should be Configured
    resource: DaemonSet.default.release-name-vpc-ovn-node
    evaluated_keys:
      - spec/template/spec/containers/[1]/readinessProbe

  vpc-ovs-flow-controllers:
  # Controller does not provide a liviness or readiness probe.
  - check_id: CKV_K8S_8 # Liveness Probe Should be Configured
    resource: DaemonSet.default.release-name-vpc-ovs-flow-controller
    evaluated_keys:
      - spec/template/spec/containers/[0]/livenessProbe
  - check_id: CKV_K8S_9 # Readiness Probe Should be Configured
    resource: DaemonSet.default.release-name-vpc-ovs-flow-controller
    evaluated_keys:
      - spec/template/spec/containers/[0]/readinessProbe
  # Components need to run as root e.g. for hostPath access.
  - check_id: CKV_K8S_40 # Containers should run as a high UID to avoid host conflict
    resource: DaemonSet.default.release-name-vpc-ovs-flow-controller

  vpc-ovs-dhcp-agent:
  # Controller does not provide a liviness or readiness probe.
  - check_id: CKV_K8S_8 # Liveness Probe Should be Configured
    resource: DaemonSet.default.release-name-vpc-ovs-dhcp-agent
    evaluated_keys:
      - spec/template/spec/containers/[0]/livenessProbe
  - check_id: CKV_K8S_9 # Readiness Probe Should be Configured
    resource: DaemonSet.default.release-name-vpc-ovs-dhcp-agent
    evaluated_keys:
      - spec/template/spec/containers/[0]/readinessProbe
  # Components need to run as root e.g. for hostPath access.
  - check_id: CKV_K8S_40 # Containers should run as a high UID to avoid host conflict
    resource: DaemonSet.default.release-name-vpc-ovs-dhcp-agent

  ## Storage chart components

  storage-host-snap-csi-plugin:
  # Note: image tag including digest and resource limits can be set via values.
  # Some containers need to run as root. SecurityContext is configurable.
  - check_id: CKV_K8S_40 # Containers should run as a high UID to avoid host conflict
    resource: DaemonSet.default.release-name-snap-csi-plugin-node
  - check_id: CKV_K8S_40 # Containers should run as a high UID to avoid host conflict
    resource: Deployment.default.release-name-snap-csi-plugin-controller
  # Containers do not provide a liveness or readiness probe.
  - check_id: CKV_K8S_8 # Liveness Probe Should be Configured
    resource: DaemonSet.default.release-name-snap-csi-plugin-node
    evaluated_keys:
      - spec/template/spec/containers/[1]/livenessProbe
  - check_id: CKV_K8S_8 # Liveness Probe Should be Configured
    resource: Deployment.default.release-name-snap-csi-plugin-controller
    evaluated_keys:
      - spec/template/spec/containers/[1]/livenessProbe
  - check_id: CKV_K8S_9 # Readiness Probe Should be Configured
    resource: DaemonSet.default.release-name-snap-csi-plugin-node
    evaluated_keys:
      - spec/template/spec/containers/[0]/readinessProbe
  - check_id: CKV_K8S_9 # Readiness Probe Should be Configured
    resource: Deployment.default.release-name-snap-csi-plugin-controller
