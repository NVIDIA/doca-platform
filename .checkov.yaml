  storage-dpu-nfs-storage-vendor-dpu-plugin:
  # Note: image tag including digest, pod securityContext and resource limits
  # can be set via values.
  # Container needs to run as root.
  - check_id: CKV_K8S_40 # Containers should run as a high UID to avoid host conflict
    resource: DaemonSet.default.release-name-nfs-storage-vendor-dpu-plugin
  # Pod does not provide a liveness or readiness probe.
  - check_id: CKV_K8S_8 # Liveness Probe Should be Configured
