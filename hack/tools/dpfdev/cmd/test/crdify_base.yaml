apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: shirts.stable.example.com
spec:
  group: stable.example.com
  scope: Namespaced
  names:
    plural: shirts
    singular: shirt
    kind: Shirt
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                color:
                  type: string
                size:
                  description: >
                    Size of the shirt.
                    
                    Deprecated: This field is deprecated and will be removed in future versions.
                  type: string
                metadata:
                  description: >
                    Deprecated: This field is unused and will be removed in a future version
                  properties:
                    annotations:
                      additionalProperties:
                        type: string
                      description: Annotations is a map of string keys and values.
                      type: object
                    labels:
                      additionalProperties:
                        type: string
                      description: Labels is a map of string keys and values.
                      type: object
                  type: object
      selectableFields:
        - jsonPath: .spec.color
        - jsonPath: .spec.size
      additionalPrinterColumns:
        - jsonPath: .spec.color
          name: Color
          type: string
        - jsonPath: .spec.size
          name: Size
          type: string
