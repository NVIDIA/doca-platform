unhandledEnforcement: None
validations:
  - name: default
    enforcement: Error
    configuration:
      # Breaking changes since 26.8
      # Allow list for false-positive "default added" errors caused by the
      # same crdify allOf/enum resolution issue as the "type" allowList below:
      # once the underlying type is misread as "", crdify also reports the
      # field's existing default value as newly added.
      allowList:
        - apiVersion: "provisioning.dpu.nvidia.com/v1alpha1"
          kind: "DPUCluster"
          field: ".status.phase"
          error: 'default added when there was none previously : "\"Pending\""'
        - apiVersion: "provisioning.dpu.nvidia.com/v1alpha1"
          kind: "DPU"
          field: ".status.dpuMode"
          error: 'default added when there was none previously : "\"dpu\""'
        - apiVersion: "provisioning.dpu.nvidia.com/v1alpha1"
          kind: "DPUDevice"
          field: ".status.dpuMode"
          error: 'default added when there was none previously : "\"dpu\""'
  - name: description
    enforcement: Warn # changing to warning is important for the deprecation feature
  - name: minLength
    enforcement: Error
  - name: enum
    enforcement: Error
    configuration:
      additionPolicy: Allow
  - name: type
    enforcement: Error
    configuration:
      allowList:
        # Breaking changes since 26.8
        # Crdify does not resolve the effective type through a duplicated allOf/enum
        # schema. Fixing the duplicate kubebuilder:validation:Enum marker that
        # produced the allOf collapses it back to a plain "type: string", which
        # crdify's type comparator misreads as a change from "" to "string".
        - apiVersion: "provisioning.dpu.nvidia.com/v1alpha1"
          kind: "DPUCluster"
          field: ".status.phase"
          error: 'type changed : "" -> "string"'
        - apiVersion: "provisioning.dpu.nvidia.com/v1alpha1"
          kind: "DPU"
          field: ".status.dpuMode"
          error: 'type changed : "" -> "string"'
        - apiVersion: "provisioning.dpu.nvidia.com/v1alpha1"
          kind: "DPUDevice"
          field: ".status.dpuMode"
          error: 'type changed : "" -> "string"'
        - apiVersion: "provisioning.dpu.nvidia.com/v1alpha1"
          kind: "DPU"
          field: ".status.deploymentMode"
          error: 'type changed : "" -> "string"'
  - name: required
    enforcement: Error
    configuration:
  - name: minimum
    enforcement: Error
    configuration:
      # Breaking changes since 26.8
      # Allow list for maxItems constraints newly added to bound unbounded
      # lists on NodeSRIOVDevicePluginConfig.
      allowList:
        - apiVersion: "noderesources.dpu.nvidia.com/v1alpha1"
          kind: "NodeSRIOVDevicePluginConfig"
          field: ".spec.devicePluginResources"
          error: "maximum constraint added when there was none previously : 64"
        - apiVersion: "noderesources.dpu.nvidia.com/v1alpha1"
          kind: "NodeSRIOVDevicePluginConfig"
          field: ".spec.devicePluginResources[*].ranges"
          error: "maximum constraint added when there was none previously : 1024"
