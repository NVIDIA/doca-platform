unhandledEnforcement: None
validations:
  - name: default
    enforcement: Error
    configuration:
      # Breaking changes since v26.4
      allowList:
        - apiVersion: "operator.dpu.nvidia.com/v1alpha1"
          kind: "DPFOperatorConfig"
          field: ".spec.nodeSRIOVDevicePluginController.replicas"
          error: 'default value changed : "1" -> "2"'
        - apiVersion: "operator.dpu.nvidia.com/v1alpha1"
          kind: "DPFOperatorConfig"
          field: ".spec.dpuServiceController.replicas"
          error: 'default value changed : "1" -> "2"'
        - apiVersion: "operator.dpu.nvidia.com/v1alpha1"
          kind: "DPFOperatorConfig"
          field: ".spec.provisioningController.osInstallTimeout"
          error: 'default value removed : "\"60m\""'
        - apiVersion: "operator.dpu.nvidia.com/v1alpha1"
          kind: "DPFOperatorConfig"
          field: ".spec.provisioningController.nodeEffectRemovalTimeout"
          error: 'default value removed : "\"0s\""'
        - apiVersion: "operator.dpu.nvidia.com/v1alpha1"
          kind: "DPFOperatorConfig"
          field: ".spec.staticClusterManager.replicas"
          error: 'default value changed : "1" -> "2"'
        - apiVersion: "operator.dpu.nvidia.com/v1alpha1"
          kind: "DPFOperatorConfig"
          field: ".spec.serviceSetController.replicas"
          error: 'default value changed : "1" -> "2"'
  - name: description
    enforcement: Warn # changing to warning is important for the deprecation feature
  - name: minLength
    enforcement: Error
    configuration:
      # Breaking changes since v26.4
      allowList:
        - apiVersion: "svc.dpu.nvidia.com/v1alpha1"
          kind: "DPUDeployment"
          field: ".spec.dpus.bfb"
          error: "minimum constraint added when there was none previously : 1"
        - apiVersion: "svc.dpu.nvidia.com/v1alpha1"
          kind: "DPUDeployment"
          field: ".spec.dpus.flavor"
          error: "minimum constraint added when there was none previously : 1"
        - apiVersion: "provisioning.dpu.nvidia.com/v1alpha1"
          kind: "DPU"
          field: ".spec.bfb"
          error: "minimum constraint added when there was none previously : 1"
        - apiVersion: "provisioning.dpu.nvidia.com/v1alpha1"
          kind: "DPU"
          field: ".spec.blueFieldSoftware"
          error: "minimum constraint added when there was none previously : 1"
  - name: maxLength
    enforcement: Error
    configuration:
      # Breaking changes since v26.4
      allowList:
        - apiVersion: "provisioning.dpu.nvidia.com/v1alpha1"
          kind: "DPU"
          field: ".spec.bfb"
          error: "maximum constraint added when there was none previously : 253"
        - apiVersion: "provisioning.dpu.nvidia.com/v1alpha1"
          kind: "DPU"
          field: ".spec.blueFieldSoftware"
          error: "maximum constraint added when there was none previously : 253"
  - name: enum
    enforcement: Error
    configuration:
      additionPolicy: Allow
  - name: required
    enforcement: Error
    configuration:
      # Breaking changes since v26.4
      allowList:
        - apiVersion: "operator.dpu.nvidia.com/v1alpha1"
          kind: "DPFOperatorConfig"
          field: ".spec"
          error: "new required fields: [deploymentMode]"
        - apiVersion: "provisioning.dpu.nvidia.com/v1alpha1"
          kind: "DPUFlavor"
          field: ".spec.configFiles[*]"
          error: "new required fields: [path]"
  - name: minimum
    enforcement: Error
    configuration:
      # Breaking changes since v26.4
      allowList:
        - apiVersion: "svc.dpu.nvidia.com/v1alpha1"
          kind: "DPUServiceInterface"
          field: ".spec.template.spec.template.spec.vf.vfID"
          error: "minimum constraint added when there was none previously : 0"
        - apiVersion: "svc.dpu.nvidia.com/v1alpha1"
          kind: "DPUServiceInterface"
          field: ".spec.template.spec.template.spec.vf.pfID"
          error: "minimum constraint added when there was none previously : 0"
        - apiVersion: "svc.dpu.nvidia.com/v1alpha1"
          kind: "DPUServiceInterface"
          field: ".spec.template.spec.template.spec.pf.pfID"
          error: "minimum constraint added when there was none previously : 0"
  - name: maximum
    enforcement: Error
    configuration:
      # Breaking changes since v26.4
      allowList:
        - apiVersion: "svc.dpu.nvidia.com/v1alpha1"
          kind: "DPUServiceInterface"
          field: ".spec.template.spec.template.spec.vf.vfID"
          error: "maximum constraint added when there was none previously : 255"
        - apiVersion: "svc.dpu.nvidia.com/v1alpha1"
          kind: "DPUServiceInterface"
          field: ".spec.template.spec.template.spec.vf.pfID"
          error: "maximum constraint added when there was none previously : 255"
        - apiVersion: "svc.dpu.nvidia.com/v1alpha1"
          kind: "DPUServiceInterface"
          field: ".spec.template.spec.template.spec.pf.pfID"
          error: "maximum constraint added when there was none previously : 255"
