# Configuration for kube-api-linter (KAL), run via `make lint`.
# It lints the CRD API types under api/<group>/<version> against Kubernetes API
# conventions. It is intentionally separate from .golangci.yml: KAL ships as a
# custom golangci-lint module, so it needs its own binary (see the
# kube-api-linter target in hack/tools/tools.mk) and its own scope.
version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - kubeapilinter
  settings:
    custom:
      kubeapilinter:
        type: module
        description: Kube API Linter lints Kube like APIs based on API conventions and best practices.
        settings:
          linters:
            # Counts below are current violations when each linter runs in isolation
            # against api/<group>/v1alpha1 (measured 2026-08-12). "auto-fixable" means
            # `make lint-api-fix` drives the count to zero on its own; the resulting
            # API changes still need `make generate` and human review.
            enable:
              - "nofloats" # Ensure floats are not used.
              - "nonullable" # Ensure that types and fields do not have the nullable marker.
              - "statussubresource" # All root objects that have a `status` field should have a status subresource.
              - "conflictingmarkers" # Lints conflicting markers as configured below.
              - "duplicatemarkers" # Ensure there are no exact duplicate markers for types and fields.
              - "statusoptional" # Ensure all first children within status should be optional.

              - "noreferences" # Discourages `Ref`/`Reference` naming.
              - "notimestamp" # Prevents usage of 'Timestamp' fields.
              - "nonpointerstructs" # Non-pointer struct fields must be marked optional/required.
              - "requiredfields" # Required fields should not be pointers, and should not have `omitempty`.
              - "optionalfields" # Ensure that all fields marked as optional adhere to being pointers and
                                  # having the `omitempty` value in their `json` tag where appropriate.
              - "defaults" # Default markers must use the preferred form.
              - "optionalorrequired" # Every field should be marked as `+optional` or `+required`.
              - "conditions" # Ensure conditions have the correct json tags and markers.
              - "jsontags" # Ensure every field has a json tag.
              - "nomaps" # Ensure maps are not used.
              - "uniquemarkers" # Ensure that types and fields do not contain more than a single definition of a marker that should only be present once.
              - "defaultorrequired" # A field with a default value cannot be required.
              - "arrayofstruct" # Arrays of structs need identifying markers.
              - "integers" # Ensure only int32 and int64 are used for integers.

              # Not enabled linters to be considered for future use. Existing findings might requre breaking API changes or exclusions.
              # - "commentstart" # Ensure comments start with the serialized version of the field name.
              # - "nophase" # Phase fields are discouraged by the Kube API conventions, use conditions instead.
              # - "nodurations" # Prevents usage of `Duration` types.
              # - "nobools" # Bools do not evolve over time, should use enums instead.
              # - "ssatags" # Ensure array fields have the appropriate listType markers.
              # - "maxlength" # Ensure all strings and arrays have maximum lengths/maximum items.

              # Not enabled linters, that require custom configuration.
              # - "forbiddenmarkers" # Needs lintersConfig.forbiddenmarkers.markers.
              # - "dependenttags"
              # - "namingconventions"
              # - "preferredmarkers"
              # - "minlength"

            # Linters below this line are disabled, pending conversation on how and when to enable them.
            disable:
            - "*" # We will manually enable new linters after understanding the impact. Disable all by default.
          lintersConfig:
            defaults:
              preferredDefaultMarker: kubebuilder:default # The preferred default marker to use. Defaults to `default`.
            conflictingmarkers:
              conflicts:
              - name: "default_vs_required"
                sets:
                  - ["default", "kubebuilder:default"]
                  - ["required", "kubebuilder:validation:Required", "k8s:required"]
                description: "A field with a default value cannot be required"
            optionalfields:
              pointers:
                preference: WhenRequired # Always | WhenRequired # Whether to always require pointers, or only when required. Defaults to `Always`.
                policy: SuggestFix # SuggestFix | Warn # The policy for pointers in optional fields. Defaults to `SuggestFix`.
              omitempty:
                policy: SuggestFix # SuggestFix | Warn | Ignore # The policy for omitempty in optional fields. Defaults to `SuggestFix`.

  exclusions:
    generated: strict
    paths:
      - zz_generated.*\.go$
      - .*_test\.go$
      # api/grpc holds generated protobuf types, not CRDs.
      - ^api/grpc/
    rules:
      # KAL should only run on our own CRD API packages. Note that paths are matched
      # relative to the directory holding this config file (repo root), which is what
      # makes the ^ anchor work.
      - path-except: ^api/
        linters:
          - kubeapilinter

      ## conflictingmarkers/default_vs_required excludes for pre-existing fields.
      # Removing either the default or the required marker on these is a breaking
      # change to a released v1alpha1 API, so they are grandfathered in. New fields
      # must not combine kubebuilder:default with required.

      # Status phase fields: defaulted to the initial phase, but always serialized.
      # BFBStatus.Phase, BlueFieldSoftwareStatus.Phase, DPUStatus.Phase.
      - path: api/provisioning/v1alpha1/(bfb|bluefield|dpu)_types.go
        text: "conflictingmarkers: field .*Status.Phase has conflicting markers"
        linters:
          - kubeapilinter

      # Spec fields with a defaulted struct/enum value that is nonetheless always set.
      - path: api/dpuservice/v1alpha1/dpudeployment_types.go
        text: "conflictingmarkers: field ServiceChains.UpgradePolicy has conflicting markers"
        linters:
          - kubeapilinter
      - path: api/dpuservice/v1alpha1/dpuservice_types.go
        text: "conflictingmarkers: field ConfigPorts.ServiceType has conflicting markers"
        linters:
          - kubeapilinter
      - path: api/dpuservice/v1alpha1/dpuserviceconfiguration_types.go
        text: "conflictingmarkers: field DPUServiceConfigurationSpec.UpgradePolicy has conflicting markers"
        linters:
          - kubeapilinter

      ## noreferences excludes for pre-existing fields.
      # Renaming these is an API-breaking change to a released v1alpha1 field;
      # grandfathered in until it can be done as part of a breaking API bump.
      - path: api/storage/v1alpha1/volume_types.go
        text: "noreferences: naming convention \"reference-to-ref\": field VolumeSpecDPU.CSIReference"
        linters:
          - kubeapilinter

      ## notimestamp excludes for pre-existing fields.
      # Renaming these is an API-breaking change to a released v1alpha1 field;
      # grandfathered in until it can be done as part of a breaking API bump.
      - path: api/dpuservice/v1alpha1/dpuservice_credential_request_types.go
        text: "notimestamp: naming convention \"notimestamp\": field DPUServiceCredentialRequestStatus.ExpirationTimestamp"
        linters:
          - kubeapilinter
      - path: api/provisioning/v1alpha1/dpu_types.go
        text: "notimestamp: naming convention \"notimestamp\": field DPUOutdated.TimeStamp"
        linters:
          - kubeapilinter

      ## nonpointerstructs excludes for pre-existing struct fields.
