apiVersion: provisioning.dpu.nvidia.com/v1alpha1
kind: DPUSet
metadata:
  name: dpuset-1
  namespace: dpf-operator-system
spec:
  dpuNodeSelector:
    matchLabels:
      feature.node.kubernetes.io/dpu-enabled: "true"
  strategy:
    rollingUpdate:
      maxUnavailable: 10%
    type: RollingUpdate
  dpuTemplate:
    annotations:
      # The pinned PLDM bundle can be older than the firmware already flashed on the shared
      # BF4 boards. Forcing on a version mismatch lets the ERoT accept that downgrade instead
      # of aborting the update task and failing the DPU.
      provisioning.dpu.nvidia.com/force-fw-update: "true"
    spec:
      # Will be overridden if DPUFlavor is provided in the e2e config.
      dpuFlavor: dpf-provisioning-hbn-ovn
      blueFieldSoftware:
        name: "bf4"
      secureBoot: true
      astraEnabled: true
      nodeEffect:
        hold: true
