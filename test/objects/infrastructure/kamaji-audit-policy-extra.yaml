apiVersion: v1
kind: ConfigMap
metadata:
  name: dpu-cluster-2-audit-policy
  namespace: dpf-operator-system
data:
  audit-policy.yaml: |
    # Log all requests at the Metadata level. RequestReceived is omitted because it
    # duplicates every request without the response code or authorization decision.
    apiVersion: audit.k8s.io/v1
    kind: Policy
    omitStages:
    - RequestReceived
    rules:
    - level: Metadata
