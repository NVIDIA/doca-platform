apiVersion: kamaji.clastix.io/v1alpha1
kind: TenantControlPlane
metadata:
  name: dpu-cluster-1
  namespace: dpf-operator-system
spec:
  dataStore: default
  controlPlane:
    deployment:
      replicas: 3
      additionalMetadata:
        labels:
          tenant.clastix.io: dpu-cluster-1
      extraArgs:
        apiServer:
          - "--audit-log-path=/var/log/kubernetes/audit.log"
          - "--audit-policy-file=/etc/kubernetes/audit-policy.yaml"
          - "--audit-log-maxage=30"
          - "--audit-log-maxbackup=10"
          - "--audit-log-maxsize=100"
        controllerManager: []
        scheduler: []
      additionalVolumes:
        - name: audit-policy
          configMap:
            name: dpu-cluster-1-audit-policy
        - name: audit-log
          hostPath:
            path: /var/log/kubernetes/kamaji/dpu-cluster-1
            type: DirectoryOrCreate
      additionalVolumeMounts:
        apiServer:
          - name: audit-policy
            mountPath: /etc/kubernetes/audit-policy.yaml
            subPath: audit-policy.yaml
            readOnly: true
          - name: audit-log
            mountPath: /var/log/kubernetes
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/master
                    operator: Exists
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/master
          operator: Exists
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
    service:
      additionalMetadata:
        labels:
          tenant.clastix.io: dpu-cluster-1
      serviceType: ClusterIP
  kubernetes:
    version: v1.35.4
    kubelet:
      # Required for compatibility to v1.34 kubelet versions.
      configurationJSONPatches:
        - op: remove
          path: /crashLoopBackOff
        - op: remove
          path: /imagePullCredentialsVerificationPolicy
        - op: add
          path: /featureGates
          value:
            KubeletCrashLoopBackOffMax: false
            KubeletEnsureSecretPulledImages: false
      cgroupfs: systemd
      preferredAddressTypes: [InternalIP,Hostname,ExternalIP]
    admissionControllers:
      - ResourceQuota
      - LimitRanger
  networkProfile:
    port: 6443
    certSANs:
      - dpu-cluster-1.clastix.labs
    serviceCidr: 10.96.0.0/16
    podCidr: 10.244.0.0/14
    dnsServiceIPs:
      - 10.96.0.10
  addons:
    coreDNS: {}
    kubeProxy: {}
