---
# Source: dpuservices/storage/examples/scenarios/trusted-k8s-cluster/virtiofs-hotplug-pf/snap-csi-plugin-dpuserviceconfiguration.yaml
# Modifications:
#   * added the controller (values from docs/do_not_publish/storage/manifests/snap-csi-plugin/DPUService-virtiofs.yaml)
#     so this single deployInCluster service runs both controller and node — upstream ships the controller
#     as a separate helm release, which the CR-only e2e flow cannot do.
#   * added node.config.virtiofsLoadDriver: false (see inline note).
#   * dropped the node image override — uses the chart default.
#   * dropped imagePullSecrets — added at runtime by the SNAP suite.
apiVersion: svc.dpu.nvidia.com/v1alpha1
kind: DPUServiceConfiguration
metadata:
  name: snap-csi-plugin
  namespace: dpf-operator-system
spec:
  deploymentServiceName: snap-csi-plugin
  upgradePolicy:
    applyNodeEffect: false
  serviceConfiguration:
    deployInCluster: true
    helmChart:
      values:
        host:
          snapCsiPlugin:
            enabled: true
            emulationMode: "virtiofs"
            controller:
              enabled: true
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                      - matchExpressions:
                          - key: "node-role.kubernetes.io/master"
                            operator: Exists
                      - matchExpressions:
                          - key: "node-role.kubernetes.io/control-plane"
                            operator: Exists
            node:
              enabled: true
              config:
                # virtio-pci is built into the host kernel, so skip the in-container modprobe that
                # otherwise fails ("exit status 125") and crashloops the plugin.
                virtiofsLoadDriver: false
