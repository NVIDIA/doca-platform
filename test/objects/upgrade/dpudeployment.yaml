apiVersion: svc.dpu.nvidia.com/v1alpha1
kind: DPUDeployment
metadata:
  name: upgrade-test
  namespace: dpf-operator-system
spec:
  dpus:
    bfb: bf-bundle
    dpuSets:
      - dpuAnnotations:
          doMagic: "true"
        nameSuffix: dpuset1
        nodeSelector:
          matchLabels:
            kubernetes.io/hostname: replace
    flavor: flavor
    nodeEffect:
      taint:
        effect: NoSchedule
        key: dpu
        value: provisioning
  revisionHistoryLimit: 10
  serviceChains:
    switches:
      - ports:
          - serviceInterface:
              matchLabels:
                uplink: p0
          - service:
              interface: app-iface
              name: example
    upgradePolicy:
      applyNodeEffect: true
  services:
    example:
      serviceConfiguration: example
      serviceTemplate: example
