apiVersion: svc.dpu.nvidia.com/v1alpha1
kind: DPUService
metadata:
  name: ovn-controller
  namespace: dpf-operator-system
spec:
  security:
    privileged: true
  serviceDaemonSet:
    nodeSelector:
      nodeSelectorTerms:
      - matchExpressions:
          - key: kubernetes.io/os
            operator: In
            values:
            - linux
          - key: kubernetes.io/arch
            operator: In
            values:
            - arm64
  helmChart:
    source:
      repoURL: oci://example.com
      version: v1.0.0
      chart: ovn-chart
    values:
      dpu:
        ovnController:
          enabled: true
          imagePullSecrets:
            - name: dpf-pull-secret
