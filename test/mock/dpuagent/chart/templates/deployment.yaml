apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.name" . }}
  labels:
    app.kubernetes.io/component: dpu
  {{- include "chart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: dpu
    {{- include "chart.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: dpu
      {{- include "chart.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ toYaml .Values.mockConfig | sha256sum }}
    spec:
      # No ServiceAccount: the mock authenticates to the management cluster with the per-DPU
      # bootstrap token and client certificate the controller hands it, like a real dpu-agent.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: mock-dpuagent
        image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
        args:
        - --config=/etc/mock-dpuagent/config.yaml
        ports:
        - name: redfish
          containerPort: 443
          protocol: TCP
        - name: hostctl
          containerPort: 80
          protocol: TCP
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
        volumeMounts:
        - name: config
          mountPath: /etc/mock-dpuagent
          readOnly: true
        - name: work
          mountPath: /var/lib/mock-dpuagent
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
      volumes:
      - name: config
        configMap:
          name: {{ include "chart.name" . }}-config
      - name: work
        emptyDir: {}
