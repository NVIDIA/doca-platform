{{- if .Values.rebootController.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "chart.name" . }}-reboot-controller-rolebinding
  labels:
    app.kubernetes.io/component: reboot-controller
  {{- include "chart.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  # Fixed name: the ClusterRole in role.yaml is generated by controller-gen with this name.
  name: mock-dpuagent-reboot-controller-role
subjects:
- kind: ServiceAccount
  name: '{{ include "chart.name" . }}-reboot-controller'
  namespace: '{{ .Release.Namespace }}'
{{- end }}
