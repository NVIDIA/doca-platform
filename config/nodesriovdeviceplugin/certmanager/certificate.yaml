# The following manifest contains the certificate CR for the webhook server.
# It is signed by dpf-webhook-issuer, the shared DPF intermediate CA for webhook serving
# certificates, which the dpf-operator helm chart creates in the DPF namespace.
# More document can be found at https://docs.cert-manager.io
# WARNING: Targets CertManager v1.0. Check https://cert-manager.io/docs/installation/upgrading/ for breaking changes.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    app.kubernetes.io/component: manager
    app.kubernetes.io/part-of: dpf-operator
  name: serving-cert  # this name should match the one appeared in default/kustomization.yaml
  namespace: system
spec:
  # SERVICE_NAME and SERVICE_NAMESPACE will be substituted by kustomize
  dnsNames:
  - SERVICE_NAME.SERVICE_NAMESPACE.svc
  - SERVICE_NAME.SERVICE_NAMESPACE.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: dpf-webhook-issuer # this name will not be prefixed, since it's not managed by kustomize
  secretName: nodesriovdeviceplugin-webhook-server-cert # this secret will not be prefixed, since it's not managed by kustomize
