---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    app.kubernetes.io/component: manager
spec:
  selector:
    matchLabels:
  replicas: 2
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: dpf-provisioning-regcred
      containers:
      - command:
        - /provisioning
        args:
        - --leader-elect
        image: controller
        name: manager
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          privileged: true
          capabilities:
            drop:
              - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        # TODO(user): Configure the resources accordingly based on the project requirements.
        # More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
        resources:
          limits:
            cpu: 2
            memory: 2Gi
          requests:
            cpu: 1
            memory: 1Gi
        ports:
          - containerPort: 8080
            name: metrics
            protocol: TCP
        env:
        # Unix socket served by the pldmunpack sidecar (see volumes pldm-unpack-socket).
        - name: PLDM_UNPACK_SOCKET_PATH
          value: /var/run/dpf/pldm-unpack.sock
        - name: PLDM_UNPACK_ENDPOINT
          value: /v1/unpack
        volumeMounts:
        - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          name: kube-api-access
          readOnly: true
        - mountPath: /var/run/dpf
          name: pldm-unpack-socket
      # PLDM fwpkg unpack HTTP API over a Unix domain socket (shared with manager).
      - name: pldmunpack
        image: bfb-registry
        command:
        - /usr/local/bin/pldmunpackserver
        args:
        - --socket-path=/var/run/dpf/pldm-unpack.sock
        - --script-path=/opt/pldm-unpack/fwpkg_unpack.py
        livenessProbe:
          exec:
            command:
            - test
            - -S
            - /var/run/dpf/pldm-unpack.sock
          initialDelaySeconds: 5
          periodSeconds: 30
        readinessProbe:
          exec:
            command:
            - test
            - -S
            - /var/run/dpf/pldm-unpack.sock
          initialDelaySeconds: 3
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 65532
          capabilities:
            drop:
              - "ALL"
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts:
        - mountPath: /var/run/dpf
          name: pldm-unpack-socket
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
      volumes:
      - name: pldm-unpack-socket
        emptyDir: {}
      - name: kube-api-access
        projected:
          defaultMode: 420
          sources:
          - serviceAccountToken:
              path: token
          - configMap:
              items:
              - key: ca.crt
                path: ca.crt
              name: kube-root-ca.crt
          - downwardAPI:
              items:
              - fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
                path: namespace
