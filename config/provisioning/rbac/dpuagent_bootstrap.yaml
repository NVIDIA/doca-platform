apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dpu-agent-csr-creator
rules:
  - apiGroups:
      - certificates.k8s.io
    resources:
      - certificatesigningrequests
    verbs:
      - create
      - get
      - list
      - watch

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dpu-agent-bootstrap
subjects:
- kind: Group
  name: system:bootstrappers:dpf:dpu-agent
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: dpu-agent-csr-creator
  apiGroup: rbac.authorization.k8s.io
