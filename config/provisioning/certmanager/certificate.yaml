# The following manifests contain a self-signed issuer CR and a certificate CR.
# The webhook serving certificate is signed by dpf-webhook-issuer, the shared DPF intermediate CA
# for webhook serving certificates, which the dpf-operator helm chart creates in the DPF namespace.
# The Redfish client certificates are signed by dpf-platform-issuer, the shared DPF intermediate CA
# for the provisioning certificates, which the DPF Operator creates in the DPF namespace.
#
# The self-signed provisioning CA below signs no leaf any more, and the upgrade migration carries
# its keypair into the platform intermediate CA and then removes it. It is still rendered here
# because the migration needs all three objects until it completes: the keypair in the Secret is
# what it carries over, the pin on the issuer is how an in-flight CA rotation is recognized, and
# the certificate is what the trust bundle publishes to validate the leaves not yet reissued.
#
# Which of them reach the cluster is therefore decided when the component is generated, not here:
# the operator stops emitting these three once the migration has deleted the CA Secret, and the
# ApplySet prunes them on that reconcile. The spec has to stay exactly as the releases that created
# them applied it, or the apply would have cert-manager reissue the CA and generate a new keypair,
# changing the identity the migration is in the middle of carrying over.
# More document can be found at https://docs.cert-manager.io
# WARNING: Targets CertManager v1.0. Check https://cert-manager.io/docs/installation/upgrading/ for breaking changes.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  labels:
    app.kubernetes.io/component: certificate
  name: selfsigned-issuer
  namespace: system
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    app.kubernetes.io/component: certificate
    app.kubernetes.io/part-of: dpf-provisioning-controller
  name: serving-cert  # this name should match the one appeared in kustomizeconfig.yaml
  namespace: system
spec:
  # SERVICE_NAME and SERVICE_NAMESPACE will be substituted by kustomize
  dnsNames:
  - SERVICE_NAME.SERVICE_NAMESPACE.svc
  - SERVICE_NAME.SERVICE_NAMESPACE.svc.cluster.local
  duration: 8760h
  renewBefore: 4360h
  issuerRef:
    kind: Issuer
    name: dpf-webhook-issuer # this name will not be prefixed, since it's not managed by kustomize
  secretName: webhook-server-cert # this secret will not be prefixed, since it's not managed by kustomize
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: issuer
  namespace: system
spec:
  ca:
    secretName: dpf-provisioning-ca-secret # this secret will not be prefixed, since it's not managed by kustomize
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ca-cert
  namespace: system
spec:
  dnsNames:
  - SERVICE_NAME.SERVICE_NAMESPACE.svc
  - SERVICE_NAME.SERVICE_NAMESPACE.svc.cluster.local
  commonName: dpf-provisioning-ca-cert
  isCA: true
  duration: 26280h
  renewBefore: 13140h
  issuerRef:
    kind: Issuer
    name: selfsigned-issuer
  privateKey:
    algorithm: ECDSA
    size: 256
  secretName: dpf-provisioning-ca-secret # this secret will not be prefixed, since it's not managed by kustomize
  
---

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: redfish-client-cert
  namespace: system
spec:
  dnsNames:
    - provisioning-controller.SERVICE_NAMESPACE.svc
    - provisioning-controller.SERVICE_NAMESPACE.svc.cluster.local
  commonName: root
  # 365 days
  duration: 8760h
  renewBefore: 4360h
  issuerRef:
    kind: Issuer
    name: dpf-platform-issuer # this name will not be prefixed, since it's not managed by kustomize
  secretName: dpf-provisioning-redfish-client-secret # this secret will not be prefixed, since it's not managed by kustomize
  usages:
    - client auth

---

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: redfish-client-cert-bf4
  namespace: system
spec:
  dnsNames:
    - provisioning-controller.SERVICE_NAMESPACE.svc
    - provisioning-controller.SERVICE_NAMESPACE.svc.cluster.local
  commonName: admin
  # 365 days
  duration: 8760h
  renewBefore: 4360h
  issuerRef:
    kind: Issuer
    name: dpf-platform-issuer # this name will not be prefixed, since it's not managed by kustomize
  secretName: dpf-provisioning-redfish-client-secret-bf4 # this secret will not be prefixed, since it's not managed by kustomize
  usages:
    - client auth
