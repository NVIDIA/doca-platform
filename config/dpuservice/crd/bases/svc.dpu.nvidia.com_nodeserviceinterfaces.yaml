                          maximum: 255
                          minimum: 0
                          type: integer
                        vfID:
                          description: The VF ID
                          maximum: 255
                          minimum: 0
                          type: integer
                        virtualNetwork:
                          description: VirtualNetwork is the VirtualNetwork name in
                            the same namespace
                          type: string
                      required:
                      - pfID
                      - vfID
                      type: object
                    vlan:
                      description: Vlan is the VLAN definition.
                      properties:
                        parentInterfaceRef:
                          description: The parent interface reference
                          type: string
