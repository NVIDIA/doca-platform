apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dpf-dpu-detector
  labels:
spec:
  selector:
    matchLabels:
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
              - key: node-role.kubernetes.io/master
                operator: DoesNotExist
      automountServiceAccountToken: false
      securityContext:
        ## Note: This is required as the NFD features file is in /etc/kubernetes
        ## TODO: This should be changed to a normal user-writable directory
        runAsUser: 0
      serviceAccountName: dpu-detector
      hostNetwork: true
      containers:
        - name: dpu-detector
          image: dpu-detector:latest
          securityContext:
            privileged: true
          command: [ "/dpu-detector" ]
          resources:
            requests:
              cpu: "100m"
              memory: "50Mi"
            limits:
              cpu: "300m"
              memory: "300Mi"
          volumeMounts:
            - name: features-d
              mountPath: "/etc/kubernetes/node-feature-discovery/features.d/"
            - name: host-sys
              mountPath: "/host-sys"
              readOnly: true
            - name: kube-api-access
              mountPath: "/var/run/secrets/kubernetes.io/serviceaccount"
              readOnly: true
      terminationGracePeriodSeconds: 10
      volumes:
        - name: features-d
          hostPath:
            path: "/etc/kubernetes/node-feature-discovery/features.d/"
        - name: host-sys
          hostPath:
            path: "/sys"
        - name: kube-api-access
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
                        