apiVersion: v1
kind: ConfigMap
metadata:
  name: bfb-registry-config
  labels:
data:
  nginx.conf: |
    error_log  /dev/stderr notice;

    worker_processes  auto;

    events {
        worker_connections  1024;
    }

    pid /nginx/nginx.pid;

    http {
        include       /usr/local/nginx/conf/mime.types;
        default_type  application/octet-stream;

        # Set all temp paths to use /nginx directory
        client_body_temp_path /nginx/client_body;
        proxy_temp_path /nginx/proxy;
        fastcgi_temp_path /nginx/fastcgi;
        uwsgi_temp_path /nginx/uwsgi;
        scgi_temp_path /nginx/scgi;

        log_format  main  '$remote_addr - $remote_user [$time_local] "$request" $status';
        log_format  tls   '$remote_addr - $remote_user [$time_local] "$request" $status '
                          'proto=$ssl_protocol cipher=$ssl_cipher';
        access_log  /dev/stdout  main;

        sendfile        on;
        keepalive_timeout  65;

        server {
            listen       ${NGINX_HTTPS_PORT} ssl;
            server_name  _;

            ssl_certificate     /etc/bfb-registry/tls/tls.crt;
            ssl_certificate_key /etc/bfb-registry/tls/tls.key;
            ssl_protocols       TLSv1.2 TLSv1.3;
            # TLS 1.2 fallback ciphers: explicit ECDHE+AEAD allowlist, matching the Redfish client
            # policy in TLSRedfishCipherSuites.
            # TLS 1.3 suites are negotiated separately and safe by default.
            ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
            ssl_prefer_server_ciphers on;

            location / {
                root   html;
                index  index.html index.htm;
            }

            location /bfb {
                # BFB downloads are the only requests served to a BMC, whose TLS client
                # is not otherwise observable; log the negotiated protocol and suite here.
                access_log /dev/stdout tls;
                root /;
                concat on;
                concat_max_files 20;
                concat_types application/octet-stream;
                concat_types *;
                concat_unique off;
            }

            # APT package repository (.deb)
            location /deb {
                root /;
                autoindex on;
                types {
                    text/plain                          Packages;
                    application/gzip                    gz;
                    application/vnd.debian.binary-package deb;
                }
            }

            # YUM/DNF package repository (.rpm)
            location /rpm {
                root /;
                autoindex on;
                types {
                    application/x-rpm                   rpm;
                    application/xml                     xml;
                    application/gzip                    gz;
                }
            }
        }
    }