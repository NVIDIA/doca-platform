apiVersion: v1
kind: ConfigMap
metadata:
  name: bfb-registry-config
  labels:
data:
  nginx.conf: |
    error_log  /dev/stderr notice;

    worker_processes  auto;

    events {
        worker_connections  1024;
    }

    pid /nginx/nginx.pid;

    http {
        include       /usr/local/nginx/conf/mime.types;
        default_type  application/octet-stream;

        # Set all temp paths to use /nginx directory
        client_body_temp_path /nginx/client_body;
        proxy_temp_path /nginx/proxy;
        fastcgi_temp_path /nginx/fastcgi;
        uwsgi_temp_path /nginx/uwsgi;
        scgi_temp_path /nginx/scgi;

        log_format  main  '$remote_addr - $remote_user [$time_local] "$request" $status';
        access_log  /dev/stdout  main;

        sendfile        on;
        keepalive_timeout  65;

        server {
            listen       ${NGINX_PORT};
            server_name  _;

            location / {
                root   html;
                index  index.html index.htm;
            }

            location /bfb {
                root /;
                concat on;
                concat_max_files 20;
                concat_types application/octet-stream;
                concat_types *;
                concat_unique off;
            }

            # APT package repository (.deb)
            location /deb {
                root /;
                autoindex on;
                types {
                    text/plain                          Packages;
                    application/gzip                    gz;
                    application/vnd.debian.binary-package deb;
                }
            }

            # YUM/DNF package repository (.rpm)
            location /rpm {
                root /;
                autoindex on;
                types {
                    application/x-rpm                   rpm;
                    application/xml                     xml;
                    application/gzip                    gz;
                }
            }
        }
    }