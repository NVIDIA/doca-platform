repositories:
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts
  - name: open-telemetry
    url: https://open-telemetry.github.io/opentelemetry-helm-charts
  - name: grafana-community
    url: https://grafana-community.github.io/helm-charts

helmDefaults:
  skipDeps: false
  wait: true
  cleanupOnFail: true

releases:
  - name: kube-prometheus-stack
    namespace: dpf-operator-system
    createNamespace: true
    chart: prometheus-community/kube-prometheus-stack
    version: 88.1.3
    labels:
      app: kube-prometheus-stack
      type: monitoring
    values:
      - values/kube-prometheus-stack.yaml
    hooks:
      # Deploy the Grafana dashboards from ./dashboards as a sidecar-discovered
      # ConfigMap. These dashboards are monitoring-stack specific and therefore
      # not part of the dpf-operator Helm chart.
      - events: [ "postsync" ]
        command: "./hooks/apply-dashboards.sh"
        args: ["dpf-operator-system"]
        showlogs: true
      # Deploy the DPF alert and recording rules from ./prometheus-rules. The
      # alerts dashboard above reads the ALERTS series and the dpf:* recorded
      # series these rules produce, so both are deployed together.
      - events: [ "postsync" ]
        command: "./hooks/apply-prometheus-rules.sh"
        showlogs: true

  - name: kube-state-metrics
    namespace: dpf-operator-system
    createNamespace: true
    chart: prometheus-community/kube-state-metrics
    version: 8.1.3
    labels:
      app: kube-state-metrics
      type: monitoring
    values:
      - values/kube-state-metrics.yaml
    needs:
      - dpf-operator-system/kube-prometheus-stack

  - name: loki
    namespace: dpf-operator-system
    createNamespace: true
    chart: grafana-community/loki
    version: 18.7.1
    labels:
      app: loki
      type: logging
    values:
      - values/loki.yaml
    needs:
      - dpf-operator-system/kube-prometheus-stack

  - name: opentelemetry-collector
    namespace: dpf-operator-system
    createNamespace: true
    chart: open-telemetry/opentelemetry-collector
    version: 0.166.0
    labels:
      app: opentelemetry-collector
      type: logging
    values:
      - values/opentelemetry-collector.yaml
    # Worker nodes using OVNK CNI have it deployed later (e.g., alongside DPU rollout).
    # In these cases, Otel pods on workers cannot become ready during monitoring
    # deployment, causing Helm to time out while waiting for the DaemonSet.
    wait: false
    needs:
      - dpf-operator-system/kube-prometheus-stack
      - dpf-operator-system/loki
