environments:
  default:
    values:
      - envs/defaults.yaml
  # Environment for shared file system configuration.
  # Used by local-path-provisioner to configure shared storage instead of local node storage.
  shared-fs:
    values:
      - envs/defaults.yaml
      - envs/shared-fs.yaml
---
repositories:
  - name: argoproj
    url: https://argoproj.github.io/argo-helm
  - name: node-feature-discovery
    url: https://kubernetes-sigs.github.io/node-feature-discovery/charts
  - name: clastix
    url: https://clastix.github.io/charts
  - name: jetstack
    url: https://charts.jetstack.io
  - name: local-storage
    url: git+https://github.com/rancher/local-path-provisioner@deploy/chart?ref=v0.0.36
  - name: openbao
    url: https://openbao.github.io/openbao-helm
  - name: external-secrets
    url: https://charts.external-secrets.io

helmDefaults:
  skipDeps: false
  wait: true
  cleanupOnFail: true

releases:
  - name: cert-manager
    namespace: cert-manager
    createNamespace: true
    chart: jetstack/cert-manager
    version: v1.21.1
    labels:
      app: cert-manager
    values:
      - values/cert-manager.yaml
    hooks:
      - events: [ "postsync" ]
        command: "kubectl"
        args: ["wait", "--for=jsonpath={.webhooks[0].clientConfig.caBundle}", "--timeout=300s", "validatingwebhookconfiguration", "cert-manager-webhook"]
        showlogs: true
      - events: [ "postsync" ]
        command: "kubectl"
        args: ["wait", "--for=jsonpath={.webhooks[0].clientConfig.caBundle}", "--timeout=300s", "mutatingwebhookconfiguration", "cert-manager-webhook"]
        showlogs: true

  - name: openbao
    namespace: openbao
    createNamespace: true
    chart: openbao/openbao
    version: 0.28.6
    condition: openbao.enabled
    # OpenBao is not ready until initialized. Disable Helm's built-in wait so
    # the postsync initialization hook can run, then wait for true readiness.
    wait: false
    labels:
      app: openbao
    values:
      - values/openbao.yaml
    needs:
      - cert-manager/cert-manager
    hooks:
      - events: [ "preapply", "presync" ]
        command: "/bin/bash"
        args: ["./hooks/openbao-create-static-seal-secret.sh", "openbao", "openbao-static-seal", "unseal.key"]
        showlogs: true
      - events: [ "postsync" ]
        command: "/bin/bash"
        args: ["./hooks/openbao-initialize.sh", "openbao", "openbao-0", "openbao-root-token"]
        showlogs: true
      - events: [ "postsync" ]
        command: "kubectl"
        args: ["wait", "-n", "openbao", "--for=condition=Ready", "--timeout=600s", "pod/openbao-0"]
        showlogs: true
      - events: [ "postsync" ]
        command: "/bin/bash"
        args: ["./hooks/copy-ca-from-certificate.sh", "openbao", "openbao-server-tls", "openbao-ca", "dpf-operator-system", "external-secrets"]
        showlogs: true

  - name: external-secrets
    namespace: external-secrets
    createNamespace: true
    chart: external-secrets/external-secrets
    version: 2.8.0
    condition: external-secrets.enabled
    labels:
      app: external-secrets
    values:
      - values/external-secrets.yaml
    needs:
      - cert-manager/cert-manager

  - name: kamaji
    namespace: "{{ .Values.namespaces.kamaji }}"
    createNamespace: true
    chart: oci://ghcr.io/nvidia/charts/kamaji
    version: 1.4.0
    timeout: 600
    labels:
      app: kamaji
    values:
      - values/kamaji.yaml
    needs:
      - cert-manager/cert-manager
    hooks:
      - events: [ "preapply" ]
        command: "./hooks/apply-crds.sh"
        args: ["oci://ghcr.io/nvidia/charts/kamaji", "1.4.0"]
        showlogs: true

  - name: maintenance-operator
    namespace: dpf-operator-system
    createNamespace: true
    chart: oci://ghcr.io/mellanox/maintenance-operator-chart
    version: 0.4.0
    labels:
      app: maintenance-operator
    values:
      - values/maintenance-operator-chart.yaml
    needs:
      - cert-manager/cert-manager
    hooks:
      - events: [ "preapply" ]
        command: "./hooks/apply-crds.sh"
        args: ["oci://ghcr.io/mellanox/maintenance-operator-chart", "0.4.0"]
        showlogs: true

  - name: argo-cd
    namespace: "{{ .Values.namespaces.argoCD }}"
    createNamespace: true
    chart: argoproj/argo-cd
    version: 10.2.2
    timeout: 600
    labels:
      app: argo-cd
    values:
      - values/argo-cd.yaml
    hooks:
      - events: [ "postsync" ]
        command: "kubectl"
        args: ["rollout", "status", "-n", "{{ .Values.namespaces.argoCD }}", "--timeout=300s", "deployment", "-l", "app.kubernetes.io/name=argocd-server"]
        showlogs: true
      - events: [ "postsync" ]
        command: "kubectl"
        args: ["rollout", "status", "-n", "{{ .Values.namespaces.argoCD }}", "--timeout=300s", "statefulset", "-l", "app.kubernetes.io/name=argocd-application-controller"]
        showlogs: true
      # The Applications below stay in dpf-operator-system even when Argo CD itself runs
      # elsewhere, because the DPF Operator creates them in its own namespace.
      # Ensure a sync is done of all applications. This is e.g. required when upgrading ArgoCD from v2 to v3 which includes changing the tracking strategy (if not configured otherwise).
      # Without a sync, ArgoCD may not delete resources because of the missing tracking information.
      # TODO: delete after v26.4.0 is released
      - events: [ "postsync" ]
        command: "/bin/bash"
        args:
        - -c
        - |
          FOUND_APPLICATIONS=0
          for app in $(kubectl get application -n dpf-operator-system -o name); do
            kubectl patch $app -n dpf-operator-system --type=merge -p '{"operation":{"initiatedBy":{"username":"helmfile"},"sync":{"syncStrategy":{"hook":{}}}}}'
            FOUND_APPLICATIONS=1
          done
          if [ $FOUND_APPLICATIONS -eq 1 ]; then
            kubectl wait application --all -n dpf-operator-system --for=jsonpath='{.status.operationState.phase}'=Succeeded --timeout=300s
          fi
        showlogs: true

  - name: node-feature-discovery
    namespace: dpf-operator-system
    createNamespace: true
    chart: node-feature-discovery/node-feature-discovery
    version: 0.19.0
    labels:
      app: node-feature-discovery
    values:
      - values/node-feature-discovery.yaml
    hooks:
      - events: [ "preapply" ]
        command: "./hooks/apply-crds.sh"
        args: ["node-feature-discovery/node-feature-discovery", "0.19.0"]
        showlogs: true

  - name: local-path-provisioner
    namespace: local-path-provisioner
    createNamespace: true
    chart: local-storage/local-path-provisioner
    labels:
      app: local-path-provisioner
    values:
      - values/local-path-provisioner.yaml
      - values/local-path-provisioner.yaml.gotmpl

  # Optional: install Kata Containers on host nodes for Kata-based DPUServices.
  # Disabled by default. Enable with: helmfile --state-values-file envs/physical.yaml sync
  - name: kata-containers
    namespace: kata-containers
    createNamespace: true
    chart: oci://ghcr.io/kata-containers/kata-deploy-charts/kata-deploy
    version: 3.32.0
    condition: kata.enabled
    labels:
      app: kata-containers
    values:
      - values/kata-containers.yaml
