apiVersion: v2
name: dpu-networking
description: A Helm chart for Kubernetes
type: application
version: 0.1.0
appVersion: "0.1.0"
dependencies:
  - name: multus
    version: "0.1.0"
    repository: file://charts/multus
    condition: multus.enabled
  - name: sriov-device-plugin
    version: "0.1.0"
    repository: file://charts/sriov-device-plugin
    condition: sriov-device-plugin.enabled
  - name: servicechainset-controller
    version: "0.1.0"
    repository: file://charts/servicechainset-controller
    condition: servicechainset-controller.enabled
  - name: nvidia-k8s-ipam
    version: "0.1.0"
    repository: file://charts/nvidia-k8s-ipam
    condition: nvidia-k8s-ipam.enabled
  - name: sfc-controller
    version: "0.1.0"
    repository: file://charts/sfc-controller
    condition: sfc-controller.enabled
  - name: cni-installer
    version: "0.1.0"
    repository: file://charts/cni-installer
    condition: cni-installer.enabled
  - name: flannel
    version: v0.27.2
    repository: https://flannel-io.github.io/flannel
    condition: flannel.enabled
  - name: kube-state-metrics
    version: "0.1.0"
    repository: file://charts/kube-state-metrics
    condition: kube-state-metrics.enabled
  - name: dpu-monitoring
    version: "0.1.0"
    repository: file://charts/dpu-monitoring
    condition: dpu-monitoring.enabled
  - name: node-problem-detector
    version: "0.1.0"
    repository: file://charts/node-problem-detector
    condition: node-problem-detector.enabled
  - name: opentelemetry-collector
    version: "0.1.0"
    repository: file://charts/opentelemetry-collector
    condition: opentelemetry-collector.enabled
  - name: kata-containers
    version: "0.1.0"
    repository: file://charts/kata-containers
    condition: kata-containers.enabled
  - name: coredns
    version: "0.1.0"
    repository: file://charts/coredns
    condition: coredns.enabled
  - name: spire-agent-rbac
    version: "0.1.0"
    repository: file://charts/spire-agent-rbac
    condition: spire-agent-rbac.enabled
annotations:
  dpfVersion: ""
  created: ""
  commit: ""
