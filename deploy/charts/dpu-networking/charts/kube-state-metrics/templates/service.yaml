{{ if .Values.deployHostManifests }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kube-state-metrics.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-state-metrics.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http-metrics
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    {{- include "kube-state-metrics.selectorLabels" . | nindent 4 }}
{{ end }}
