{{ if .Values.deployDPUManifests }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kube-state-metrics.fullname" . }}
  labels:
    {{- include "kube-state-metrics.labels" . | nindent 4 }}
rules:
  - apiGroups: ["svc.dpu.nvidia.com"]
    resources:
      - servicechains
      - servicechainsets
      - serviceinterfaces
      - serviceinterfacesets
    verbs: ["list", "watch"]
  - apiGroups: ["nv-ipam.nvidia.com"]
    resources:
      - cidrpools
      - ippools
    verbs: ["list", "watch"]
  - apiGroups: ["k8s.cni.cncf.io"]
    resources: ["network-attachment-definitions"]
    verbs: ["list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["list", "watch"]
  {{- /* Grant list/watch on the enabled collectors, grouped by API group. */}}
  {{- $core := list }}
  {{- $apps := list }}
  {{- $batch := list }}
  {{- range .Values.collectors }}
  {{- if has . (list "daemonsets" "deployments" "replicasets" "statefulsets") }}
  {{- $apps = append $apps . }}
  {{- else if has . (list "cronjobs" "jobs") }}
  {{- $batch = append $batch . }}
  {{- else }}
  {{- $core = append $core . }}
  {{- end }}
  {{- end }}
  {{- with $core }}
  - apiGroups: [""]
    resources:
      {{- range . }}
      - {{ . }}
      {{- end }}
    verbs: ["list", "watch"]
  {{- end }}
  {{- with $apps }}
  - apiGroups: ["apps"]
    resources:
      {{- range . }}
      - {{ . }}
      {{- end }}
    verbs: ["list", "watch"]
  {{- end }}
  {{- with $batch }}
  - apiGroups: ["batch"]
    resources:
      {{- range . }}
      - {{ . }}
      {{- end }}
    verbs: ["list", "watch"]
  {{- end }}
{{- if .Values.serviceAccount.name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kube-state-metrics.fullname" . }}
  labels:
    {{- include "kube-state-metrics.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kube-state-metrics.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if .Values.rbac.serviceAccounts }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kube-state-metrics.fullname" . }}-dpu
  labels:
    {{- include "kube-state-metrics.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kube-state-metrics.fullname" . }}
subjects:
{{- range .Values.rbac.serviceAccounts }}
- kind: ServiceAccount
  name: {{ .name }}
  namespace: {{ .namespace }}
{{- end }}
{{- end }}
{{ end }}
