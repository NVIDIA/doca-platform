{{- if and .Values.deployHostManifests (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/ServiceMonitor") }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "kube-state-metrics.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-state-metrics.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "kube-state-metrics.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http-metrics
      interval: 30s
      scrapeTimeout: 10s
      # Keep the DPU networking resource state metrics and the kube_* metrics
      # of the enabled collectors. Pod metrics are the main cardinality driver
      # and are limited to the ones consumed by the DPF dashboards and
      # alert/recording rules.
      metricRelabelings:
        - sourceLabels: [__name__]
          action: keep
          regex: dpf_(servicechain|servicechainset|serviceinterface|serviceinterfaceset|cidrpool|ippool|network_attachment_definition)_.+|kube_pod_info|kube_pod_labels|kube_pod_status_phase|kube_pod_status_ready|kube_pod_container_info|kube_pod_container_status_restarts_total|kube_pod_container_status_waiting_reason|kube_({{ include "kube-state-metrics.collectorMetricRegex" . }})(_.+)?
{{- end }}
