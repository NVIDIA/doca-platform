# -- deployDPUManifests controls whether the manifests that are required in the DPUCluster should be deployed.
deployDPUManifests: false
# -- deployHostManifests controls whether the manifests that are required in the host cluster should be deployed.
deployHostManifests: false

image:
  repository: registry.k8s.io/kube-state-metrics/kube-state-metrics
  pullPolicy: IfNotPresent
  tag: v2.18.0@sha256:1545919b72e3ae035454fc054131e8d0f14b42ef6fc5b2ad5c751cafa6b2130e

# -- collectors is the list of resources kube-state-metrics collects state
# metrics for. The container --resources argument, the ClusterRole rules and
# the ServiceMonitor metric allowlist are all derived from this list. Only
# resources from the core, apps and batch API groups are supported; pod
# metrics are additionally filtered to a low-cardinality allowlist in the
# ServiceMonitor.
collectors:
  - cronjobs
  - daemonsets
  - deployments
  - endpoints
  - jobs
  - namespaces
  - nodes
  - persistentvolumeclaims
  - persistentvolumes
  - pods
  - replicasets
  - resourcequotas
  - services
  - statefulsets

serviceAccount:
  name: null
imagePullSecrets: []
volumes: []
env: []
volumeMounts: []
rbac:
  serviceAccounts: []

resources:
  limits:
    cpu: 200m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi
