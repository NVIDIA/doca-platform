serviceDaemonSet:
  labels: {}

image:
  repository: otel/opentelemetry-collector-contrib
  pullPolicy: IfNotPresent
  tag: "0.146.1@sha256:f6e429c1052ab50f85a7afa5f7e32f25931697751622b0e1f453d10f79a1df3c"

imagePullSecrets: []

resources:
  limits:
    cpu: 200m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

logging:
  # -- endpoint where the DPU cluster collector sends logs to the management cluster.
  # This MUST be set via DPFOperatorConfig.spec.monitoring.openTelemetryCollector.logging.endpoint.
  # Example: "http://10.0.110.1:30050" (management cluster node IP with NodePort).
  endpoint: ""

metrics:
  # -- endpoint where the DPU cluster collector sends metrics to the management cluster.
  # This MUST be set via DPFOperatorConfig.spec.monitoring.openTelemetryCollector.metrics.endpoint.
  # Example: "http://10.0.110.1:30050" (management cluster node IP with NodePort).
  endpoint: ""
