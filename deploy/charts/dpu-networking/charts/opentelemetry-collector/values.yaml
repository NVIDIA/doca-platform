serviceDaemonSet:
  labels: {}

image:
  repository: otel/opentelemetry-collector-contrib
  pullPolicy: IfNotPresent
  tag: "0.157.0@sha256:f2f01157055a9b2aab9df7118e1f1c9abf345e99b23bc7a2bc791db374a7d0f6"

imagePullSecrets: []

resources:
  limits:
    cpu: 200m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

# -- Collector configuration for this chart release. Set it on the DPUService that
# installs the dpu-networking chart, at
# spec.helmChart.values.opentelemetry-collector.config. Accepts a map, rendered
# as YAML, or a string of raw collector YAML.
# An empty config keeps the pipelines built from logging, metrics, and tracing.
# The DaemonSet probes call the health_check extension on port 13133, so a custom
# config must keep that extension or the collector will not become Ready.
# The Service exposes 4317 (otlp-grpc), 4318 (otlp-http), and 8888 (metrics). Use
# extraPorts for any other port the custom config listens on.
config: { }

# -- Additional ports exposed on the collector container and Service when config
# listens somewhere other than 4317, 4318, or 8888.
# Each entry requires name and containerPort. protocol defaults to TCP.
# servicePort defaults to containerPort.
# Example:
# - name: jaeger-grpc
#   containerPort: 14250
#   protocol: TCP
#   servicePort: 14250
extraPorts: [ ]

logging:
  # -- endpoint where the DPU cluster collector sends logs to the management cluster.
  # This MUST be set via DPFOperatorConfig.spec.monitoring.openTelemetryCollector.logging.endpoint.
  # Used when config is empty.
  # Example: "http://10.0.110.1:30050" (management cluster node IP with NodePort).
  endpoint: ""
  # -- OTLP transport used to export to the endpoint: "http" (OTLP/HTTP) or "grpc" (OTLP/gRPC).
  # Set via DPFOperatorConfig.spec.monitoring.openTelemetryCollector.logging.transport.
  transport: "http"
  # -- PEM-encoded CA certificate bundle used to verify the endpoint's TLS certificate.
  # Set via DPFOperatorConfig.spec.monitoring.openTelemetryCollector.logging.caSecretRef.
  # If empty, TLS endpoints are verified against the system CA pool.
  caCert: ""

metrics:
  # -- endpoint where the DPU cluster collector sends metrics to the management cluster.
  # This MUST be set via DPFOperatorConfig.spec.monitoring.openTelemetryCollector.metrics.endpoint.
  # Used when config is empty.
  # Example: "http://10.0.110.1:30050" (management cluster node IP with NodePort).
  endpoint: ""
  # -- OTLP transport used to export to the endpoint: "http" (OTLP/HTTP) or "grpc" (OTLP/gRPC).
  # Set via DPFOperatorConfig.spec.monitoring.openTelemetryCollector.metrics.transport.
  transport: "http"
  # -- PEM-encoded CA certificate bundle used to verify the endpoint's TLS certificate.
  # Set via DPFOperatorConfig.spec.monitoring.openTelemetryCollector.metrics.caSecretRef.
  # If empty, TLS endpoints are verified against the system CA pool.
  caCert: ""

tracing:
  # -- endpoint where the DPU cluster collector forwards traces received from local OTLP
  # producers (e.g. DOCA services on the DPU) to the management cluster.
  # This MUST be set via DPFOperatorConfig.spec.monitoring.openTelemetryCollector.tracing.endpoint.
  # Used when config is empty.
  # Example: "http://10.0.110.1:30050" (management cluster node IP with NodePort).
  endpoint: ""
  # -- OTLP transport used to export to the endpoint: "http" (OTLP/HTTP) or "grpc" (OTLP/gRPC).
  # Set via DPFOperatorConfig.spec.monitoring.openTelemetryCollector.tracing.transport.
  transport: "http"
  # -- PEM-encoded CA certificate bundle used to verify the endpoint's TLS certificate.
  # Set via DPFOperatorConfig.spec.monitoring.openTelemetryCollector.tracing.caSecretRef.
  # If empty, TLS endpoints are verified against the system CA pool.
  caCert: ""