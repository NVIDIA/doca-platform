serviceDaemonSet:
  labels: {}

image:
  repository: otel/opentelemetry-collector-contrib
  pullPolicy: IfNotPresent
  tag: "0.157.0@sha256:f2f01157055a9b2aab9df7118e1f1c9abf345e99b23bc7a2bc791db374a7d0f6"

imagePullSecrets: []

resources:
  limits:
    cpu: 200m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

logging:
  # -- endpoint where the DPU cluster collector sends logs/metrics to the management cluster.
  # This MUST be set via DPFOperatorConfig.spec.monitoring.openTelemetryCollector.endpoint.
  # Example: "http://10.0.110.1:30050" (management cluster node IP with NodePort).
  endpoint: ""
  # -- OTLP transport used to export to the endpoint: "http" (OTLP/HTTP) or "grpc" (OTLP/gRPC).
  # Set via DPFOperatorConfig.spec.monitoring.openTelemetryCollector.logging.transport.
  transport: "http"
  # -- PEM-encoded CA certificate bundle used to verify the endpoint's TLS certificate.
  # Set via DPFOperatorConfig.spec.monitoring.openTelemetryCollector.logging.caSecretRef.
  # If empty, TLS endpoints are verified against the system CA pool.
  caCert: ""

metrics:
  # -- endpoint where the DPU cluster collector sends metrics to the management cluster.
  # This MUST be set via DPFOperatorConfig.spec.monitoring.openTelemetryCollector.metrics.endpoint.
  # Example: "http://10.0.110.1:30050" (management cluster node IP with NodePort).
  endpoint: ""
  # -- OTLP transport used to export to the endpoint: "http" (OTLP/HTTP) or "grpc" (OTLP/gRPC).
  # Set via DPFOperatorConfig.spec.monitoring.openTelemetryCollector.metrics.transport.
  transport: "http"
  # -- PEM-encoded CA certificate bundle used to verify the endpoint's TLS certificate.
  # Set via DPFOperatorConfig.spec.monitoring.openTelemetryCollector.metrics.caSecretRef.
  # If empty, TLS endpoints are verified against the system CA pool.
  caCert: ""