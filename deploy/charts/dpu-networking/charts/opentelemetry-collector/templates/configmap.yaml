apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opentelemetry-collector.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opentelemetry-collector.labels" . | nindent 4 }}
data:
  otel-collector-config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      filelog/pods:
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          - /var/log/pods/*/opentelemetry-collector/*.log
          - /var/log/doca/**/*.log
        start_at: end
        include_file_path: true
        include_file_name: false
        operators:
          - type: container
            id: container-parser
            max_log_size: 102400

      filelog/doca:
        include:
          - /var/log/doca/**/*.log
        start_at: end
        include_file_path: true

      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

      kubeletstats:
        collection_interval: 30s
        auth_type: serviceAccount
        endpoint: "https://${env:K8S_NODE_IP}:10250"
        insecure_skip_verify: true
        metric_groups: [container, pod, node]

    processors:
      memory_limiter:
        check_interval: 5s
        limit_mib: 512
        spike_limit_mib: 128

      batch:
        timeout: 10s
        send_batch_size: 1024

      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.cronjob.name
            - k8s.job.name
            - k8s.node.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.pod.start_time
          labels:
            - tag_name: app
              key: app.kubernetes.io/name
              from: pod
            - tag_name: component
              key: app.kubernetes.io/component
              from: pod

      resource:
        attributes:
          - key: cluster
            value: ${env:CLUSTER_NAME}
            action: upsert
          - key: cluster_namespace
            value: ${env:CLUSTER_NAMESPACE}
            action: upsert
          # Each collector only scrapes its own node's kubelet, so the node the
          # collector runs on identifies every pod and container metric it emits.
          # This lets metrics be filtered by DPU node.
          - key: k8s.node.name
            value: ${env:K8S_NODE_NAME}
            action: upsert

    exporters:
      otlphttp/log:
        endpoint: {{ .Values.logging.endpoint | quote }}
        tls:
          insecure: true
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 1h

      otlphttp/metrics:
        endpoint: {{ .Values.metrics.endpoint | quote }}
        tls:
          insecure: true
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 1h

      debug:
        verbosity: basic
        sampling_initial: 5
        sampling_thereafter: 200

    service:
      extensions: [health_check]
      pipelines:
        logs/pods:
          receivers: [filelog/pods]
          processors: [memory_limiter, k8sattributes, resource, batch]
          exporters: [otlphttp/log, debug]

        logs/doca:
          receivers: [filelog/doca]
          processors: [memory_limiter, resource, batch]
          exporters: [otlphttp/log, debug]

        logs/otlp:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resource, batch]
          exporters: [otlphttp/log, debug]

        metrics:
          receivers: [kubeletstats, otlp]
          processors: [memory_limiter, k8sattributes, resource, batch]
          exporters: [otlphttp/metrics, debug]
