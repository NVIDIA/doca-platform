imagePullSecrets: []
kubeSriovDevicePlugin:
  # configInit resolves which config the plugin consumes: the one dpu-agent generated for
  # this node when it exists, otherwise sriovdpConfig.configJson below.
  configInit:
    image:
      repository: example.com/dpf-system
      tag: v0.1.0
    imagePullPolicy: IfNotPresent
    resources:
      limits:
        cpu: 100m
        memory: 50Mi
      requests:
        cpu: 10m
        memory: 20Mi
  kubeSriovdp:
    args:
    - --log-dir=sriovdp
    - --log-level=10
    containerSecurityContext:
      privileged: true
    image:
      repository: ghcr.io/k8snetworkplumbingwg/sriov-network-device-plugin
      tag: v3.11.0@sha256:7c5901727d4500f103f038c178b41dc6450afa6f324306c1973495c9a7c4f5a5
    imagePullPolicy: IfNotPresent
    resources:
      limits:
        cpu: "1"
        memory: 200Mi
      requests:
        cpu: 250m
        memory: 40Mi
kubernetesClusterDomain: cluster.local
sriovDevicePlugin:
  serviceAccount:
    annotations: {}
sriovdpConfig:
  # configJson is the fallback used on DPUs whose BFB runs a dpu-agent that does not yet
  # generate a config (pre upgrade case). It describes the pools that old dpu-agent creates, so it is tied to that
  # release and should not be edited to describe anything else.
  configJson: |-
    {
        "resourceList": [{
            "resourceName": "bf_sf",
            "resourcePrefix": "nvidia.com",
            "deviceType": "auxNetDevice",
            "selectors": [{
                "vendors": ["15b3"],
                "pfNames": ["p0#1-100"],
                "isRdma": true,
                "auxTypes": ["sf"],
                "needVhostNet": true
            }]
        }, 
        {
            "resourceName": "bf_sf_trusted",
            "resourcePrefix": "nvidia.com",
            "deviceType": "auxNetDevice",
            "selectors": [{
                "vendors": ["15b3"],
                "pfNames": ["p0#101-110"],
                "auxTypes": ["sf"],
                "needVhostNet": true
            }]
        },
        {
            "resourceName": "bf_vf",
            "resourcePrefix": "nvidia.com",
            "deviceType": "netDevice",
            "selectors": [{
                "vendors": ["15b3"],
                "pfNames": ["p0", "p1"],
                "isRdma": true,
                "needVhostNet": true
            }]
        }]
    }
