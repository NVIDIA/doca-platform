{{- if and .Values.deployDPUManifests .Values.rbac.serviceAccounts }}
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "nvidia-k8s-ipam.fullname" . }}-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "nvidia-k8s-ipam.fullname" . }}-controller
subjects:
{{- range .Values.rbac.serviceAccounts }}
- kind: ServiceAccount
  name: {{ .name }}
  namespace: {{ .namespace }}
{{- end }}
{{- end }}
