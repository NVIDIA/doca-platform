{{- range $name, $shim := .Values.shims }}
{{- if and (kindIs "map" $shim) (eq (toString $shim.enabled) "true") }}
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata-{{ $name }}
  labels:
    {{- include "kata-containers.labels" $ | nindent 4 }}
handler: kata-{{ $name }}
overhead:
  podFixed:
    memory: "160Mi"
    cpu: "250m"
scheduling:
  nodeSelector:
    katacontainers.io/kata-runtime: "true"
{{- end }}
{{- end }}
