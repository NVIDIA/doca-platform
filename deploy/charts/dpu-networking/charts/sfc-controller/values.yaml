global:
  serviceDaemonSet:
    updateStrategy:
      # -- DaemonSet update strategy. The DPUService controller supplies rollout settings when managed by DPF.
      type: RollingUpdate

controllerManager:
  manager:
    # No --leader-elect: sfc-controller uses per-node sharding
    args: []
    # -- Zero indicates feature is disabled (default). Set a non zero value to timeout duration and enable this feature. Kubernetes can cause the pod to restart earlier under connectivity constraints in which case flows are always cleaned up under this mode.
    secureFlowDeletionTimeout: 0s
    ports:
      metrics: 61180
      health: 61181
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
    image:
      repository: example.com/dpf-system
      tag: v0.1.0
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 512Mi
  serviceAccount:
    annotations: {}
imagePullSecrets: []

# -- tracing configures the sfc-controller's own OTLP trace export. When
# DPFOperatorConfig spec.monitoring.openTelemetryCollector.tracing is set, the operator points it at
# the DPU cluster opentelemetry-collector Service, which forwards the spans to the management cluster.
tracing:
  # -- endpoint is the OTLP endpoint to export trace spans to. If empty and dpuCollector is false,
  # tracing is disabled.
  endpoint: ""
  # -- dpuCollector sends the spans to the DPU cluster opentelemetry-collector Service of the same
  # cluster. It is ignored when endpoint is set.
  dpuCollector: false
  # -- transport is the OTLP transport used to export trace spans: "http" (default) or "grpc".
  transport: ""
  # -- caPEM is a PEM-encoded CA certificate bundle used to verify the endpoint's TLS
  # certificate. If empty, TLS endpoints are verified against the system CA pool.
  caPEM: ""
  # -- recordIdleReconciles exports the spans of idle reconciles. By default they are skipped.
  recordIdleReconciles: false
  # -- recordUnchangedReconciles exports the spans of reconciles that changed nothing on their object, did not fail and have no child spans. By default they are skipped.
  recordUnchangedReconciles: false
  # -- rolloutTimeout is how long a change may take to become ready before its rollout span is exported as timed out, for example "30m". "0s" turns the timeout off. If empty, the controller's default of 1h is used.
  rolloutTimeout: ""
  # samplingPercent is the share of the traces that is exported, from 0 to 100. If unset, all traces are exported.
  # samplingPercent: 100

openvSwitchRunDir: /var/run/openvswitch
openvSwitchBinDir: /usr/bin
openvSwitchSharedLibraryDir: /lib
openvSwitchSharedLibrary64Dir: ""
# dpuLinkerCachePath, when set, mounts the given DPU path (expected: the
# prebuilt dynamic-linker cache file, e.g. /etc/ld.so.cache) read-only into
# the SFC Controller container. This lets host OVS binaries resolve shared
# libraries using the DPU's linker configuration. Leave empty to skip.
dpuLinkerCachePath: ""
# dpuOptLibraryPath, when set, mounts the given DPU directory read-only into
# the SFC Controller container. Useful on distributions that install vendor
# libraries outside standard paths (e.g. /usr/opt on RHCOS BFB). Leave empty to skip.
dpuOptLibraryPath: ""
