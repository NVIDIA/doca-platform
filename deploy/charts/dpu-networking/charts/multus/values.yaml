imagePullSecrets: []
mtu: 1500
kubeMultusDs:
  image:
    repository: ghcr.io/k8snetworkplumbingwg/multus-cni
    tag: v3.9.3@sha256:c173235642a10055db53bc43898fc1058cc6b97178fc3472ce4dafdd6d940d0b
  installMultusBinary:
    containerSecurityContext:
      privileged: true
    resources:
      requests:
        cpu: 10m
        memory: 15Mi
  kubeMultus:
    containerSecurityContext:
      privileged: true
    resources:
      limits:
        cpu: 100m
        memory: 100Mi
      requests:
        cpu: 100m
        memory: 100Mi
kubernetesClusterDomain: cluster.local
multus:
  serviceAccount:
    annotations: {}
multusDaemonConfig:
  daemonConfigJson: |-
    {
      "name": "multus-cni-network",
      "type": "multus",
      "capabilities": {
        "portMappings": true
      },
      "delegates": [
        {
          "cniVersion": "0.3.1",
          "name": "default-cni-network",
          "plugins": [
            {
              "type": "flannel",
              "name": "flannel.1",
                "delegate": {
                  "isDefaultGateway": true,
                  "hairpinMode": true
                }
              },
              {
                "type": "portmap",
                "capabilities": {
                  "portMappings": true
                }
              }
          ]
        }
      ],
      "kubeconfig": "/etc/cni/net.d/multus.d/multus.kubeconfig"
    }

cniBinDir: /opt/cni/bin
cniConfDir: /etc/cni/net.d