apiVersion: v1
kind: Service
metadata:
  name: {{ include "node-problem-detector.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "node-problem-detector.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 20257
      targetPort: 20257
      protocol: TCP
      name: exporter
  selector:
    {{- include "node-problem-detector.selectorLabels" . | nindent 4 }}
