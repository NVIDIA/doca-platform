apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "node-problem-detector.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "node-problem-detector.labels" . | nindent 4 }}
  annotations:
    {{- include "node-problem-detector.annotations" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "node-problem-detector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "node-problem-detector.labels" . | nindent 8 }}
      annotations:
        {{- include "node-problem-detector.annotations" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      serviceAccountName: {{ include "node-problem-detector.serviceAccountName" . }}
      imagePullSecrets: {{ .Values.imagePullSecrets | default list | toJson }}
      # hostNetwork so that node health keeps being reported even when pod
      # networking on the node is broken, which is one of the failure modes
      # this DaemonSet exists to detect.
      hostNetwork: true
      # hostPID so the OVS liveness checks can see host processes in /proc.
      # Process names used by the checks are world-readable, and without
      # CAP_SYS_PTRACE and CAP_SYS_ADMIN the host processes cannot be traced
      # and their namespaces cannot be entered.
      hostPID: true
      securityContext:
        # The persistent journal files under /var/log/journal are mode 0640
        # and owned by root, so uid 0 reads them by ownership alone without
        # any added capabilities.
        runAsNonRoot: false
        runAsUser: 0
      tolerations:
      - operator: Exists
        effect: NoSchedule
      - operator: Exists
        effect: NoExecute
      containers:
      - name: node-problem-detector
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
        command:
        - /node-problem-detector
        args:
        - --logtostderr
        - --config.system-log-monitor=/config/kernel-monitor.json
        - --config.system-stats-monitor=/config/system-stats-monitor.json
        - --config.custom-plugin-monitor=/config/dpu-custom-plugin-monitor.json
        - --prometheus-address=0.0.0.0
        - --prometheus-port=20257
        ports:
        - name: exporter
          containerPort: 20257
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /metrics
            port: exporter
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /metrics
            port: exporter
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
        - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          name: kube-api-access
          readOnly: true
        - name: config
          mountPath: /config
          readOnly: true
        - name: log
          mountPath: /var/log
          readOnly: true
        - name: host-sys
          mountPath: /sys
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: kube-api-access
        projected:
          defaultMode: 420
          sources:
          - serviceAccountToken:
              path: token
          - configMap:
              items:
              - key: ca.crt
                path: ca.crt
              name: kube-root-ca.crt
          - downwardAPI:
              items:
              - fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
                path: namespace
      - name: config
        configMap:
          name: {{ include "node-problem-detector.fullname" . }}-config
          defaultMode: 0755
      - name: log
        hostPath:
          path: /var/log
      - name: host-sys
        hostPath:
          path: /sys
      - name: tmp
        emptyDir:
          sizeLimit: 16Mi
