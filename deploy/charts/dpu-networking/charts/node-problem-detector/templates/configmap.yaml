apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "node-problem-detector.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "node-problem-detector.labels" . | nindent 4 }}
data:
  # Rules copied from https://github.com/kubernetes/node-problem-detector/blob/master/deployment/node-problem-detector-config.yaml
  # Kernel messages are read with the journald plugin from the persistent journal files
  # under /var/log/journal (mounted read-only) instead of the kmsg plugin: opening
  # /dev/kmsg from a container requires a device-cgroup exception that only privileged
  # pods get, and this DaemonSet deliberately runs unprivileged. The journal files are
  # owned by root, so the container reads them as uid 0 without any added capabilities.
  # OVS OOM detection lives here as a log rule (condition OVSHealthy) for the same
  # reason: it previously shelled out to journalctl on the host via nsenter.
  kernel-monitor.json: |
    {
      "plugin": "journald",
      "pluginConfig": {
        "source": "kernel"
      },
      "logPath": "/var/log/journal",
      "lookback": "5m",
      "bufferSize": 10,
      "source": "kernel-monitor",
      "conditions": [
        {
          "type": "KernelDeadlock",
          "reason": "KernelHasNoDeadlock",
          "message": "kernel has no deadlock"
        },
        {
          "type": "ReadonlyFilesystem",
          "reason": "FilesystemIsNotReadOnly",
          "message": "Filesystem is not read-only"
        },
        {
          "type": "OVSHealthy",
          "reason": "IsHealthy",
          "message": "OVS processes have not been OOM killed"
        }
      ],
      "rules": [
        {
          "type": "temporary",
          "reason": "OOMKilling",
          "pattern": "Kill process \\d+ (.+) score \\d+ or sacrifice child\\nKilled process \\d+ (.+) total-vm:\\d+kB, anon-rss:\\d+kB, file-rss:\\d+kB.*"
        },
        {
          "type": "temporary",
          "reason": "TaskHung",
          "pattern": "task \\S+:\\w+ blocked for more than \\w+ seconds\\."
        },
        {
          "type": "temporary",
          "reason": "UnregisterNetDevice",
          "pattern": "unregister_netdevice: waiting for \\w+ to become free. Usage count = \\d+"
        },
        {
          "type": "temporary",
          "reason": "KernelOops",
          "pattern": "BUG: unable to handle kernel NULL pointer dereference at .*"
        },
        {
          "type": "temporary",
          "reason": "KernelOops",
          "pattern": "divide error: 0000 \\[#\\d+\\] SMP"
        },
        {
          "type": "temporary",
          "reason": "MemoryReadError",
          "pattern": "CE memory read error .*"
        },
        {
          "type": "permanent",
          "condition": "KernelDeadlock",
          "reason": "DockerHung",
          "pattern": "task docker:\\w+ blocked for more than \\w+ seconds\\."
        },
        {
          "type": "permanent",
          "condition": "ReadonlyFilesystem",
          "reason": "FilesystemIsReadOnly",
          "pattern": "Remounting filesystem read-only"
        },
        {
          "type": "permanent",
          "condition": "OVSHealthy",
          "reason": "OOMKilled",
          "pattern": ".*Killed process \\d+ \\((ovs-vswitchd|ovsdb-server)\\).*"
        }
      ]
    }
  system-stats-monitor.json: |
    {
      "diskMonitor": {
        "enabled": true
      },
      "cpuMonitor": {
        "enabled": false
      },
      "memoryMonitor": {
        "enabled": false
      },
      "hostMonitor": {
        "enabled": false
      }
    }
  dpu-custom-plugin-monitor.json: |
    {
      "plugin": "custom",
      "pluginConfig": {
        "invoke_interval": "30s",
        "timeout": "5s",
        "max_output_length": 80,
        "concurrency": 3,
        "enable_message_change_based_condition_update": false
      },
      "source": "dpu-health-checker",
      "conditions": [
        {
          "type": "OVSvSwitchdHealthy",
          "reason": "IsHealthy",
          "message": "ovs-vswitchd service is running"
        },
        {
          "type": "OVSDBHealthy",
          "reason": "IsHealthy",
          "message": "ovsdb-server service is running"
        },
        {
          "type": "PFRepresentorsHealthy",
          "reason": "PFRepresentorsFound",
          "message": "Host PF representors are present"
        },
        {
          "type": "UplinkHealthy",
          "reason": "IsUp",
          "message": "Physical uplink is up"
        },
        {
          "type": "MTUConfigured",
          "reason": "IsCorrect",
          "message": "Network MTU is correctly configured"
        }
      ],
      "rules": [
        {
          "type": "permanent",
          "condition": "OVSvSwitchdHealthy",
          "reason": "OVSvSwitchNotRunning",
          "path": "/config/check_ovs_vswitchd.sh",
          "timeout": "3s"
        },
        {
          "type": "permanent",
          "condition": "OVSDBHealthy",
          "reason": "OVSdbNotRunning",
          "path": "/config/check_ovs_ovsdb.sh",
          "timeout": "3s"
        },
        {
          "type": "permanent",
          "condition": "PFRepresentorsHealthy",
          "reason": "PFRepresentorsMissing",
          "path": "/config/check_pf_representors.sh",
          "timeout": "3s"
        },
        {
          "type": "permanent",
          "condition": "UplinkHealthy",
          "reason": "UplinkDown",
          "path": "/config/check_uplink.sh",
          "timeout": "3s"
        },
        {
          "type": "permanent",
          "condition": "MTUConfigured",
          "reason": "Mismatch",
          "path": "/config/check_mtu.sh",
          "timeout": "3s"
        }
      ]
    }
{{- range $path, $file := $.Files.Glob "scripts/*.sh" }}
  {{ base $path }}: |
{{ $file | toString | indent 4 }}
{{- end }}
