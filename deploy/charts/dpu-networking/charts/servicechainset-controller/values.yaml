# -- deployDPUManifests controls whether the manifests that are required in the DPUCluster should be deployed.
deployDPUManifests: false
# -- deployHostManifests controls whether the manifests that are required in the host cluster should be deployed.
deployHostManifests: false

controllerManager:
  manager:
    args:
    - --leader-elect
    - --leader-election-namespace=$(POD_NAMESPACE)
    containerSecurityContext:
      runAsUser: 65532
      privileged: false
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
    image:
      repository: example.com/dpf-system
      tag: v0.1.0
    resources:
      limits:
        cpu: 1500m
        memory: 2560Mi
      requests:
        cpu: 250m
        memory: 512Mi
  replicas: 2
# -- tracing configures the servicechainset-controller's own OTLP trace export. The operator sets it
# from DPFOperatorConfig spec.monitoring.tracing.otlp.
tracing:
  # -- endpoint is the OTLP endpoint to export trace spans to. If empty, tracing is disabled.
  endpoint: ""
  # -- transport is the OTLP transport used to export trace spans: "http" (default) or "grpc".
  transport: ""
  # -- caPEM is a PEM-encoded CA certificate bundle used to verify the endpoint's TLS
  # certificate. If empty, TLS endpoints are verified against the system CA pool.
  caPEM: ""
  # -- recordIdleReconciles exports the spans of idle reconciles. By default they are skipped.
  recordIdleReconciles: false
  # -- recordUnchangedReconciles exports the spans of reconciles that changed nothing on their object, did not fail and have no child spans. By default they are skipped.
  recordUnchangedReconciles: false
  # -- rolloutTimeout is how long a change may take to become ready before its rollout span is exported as timed out, for example "30m". "0s" turns the timeout off. If empty, the controller's default of 1h is used.
  rolloutTimeout: ""
  # samplingPercent is the share of the traces that is exported, from 0 to 100. If unset, all traces are exported.
  # samplingPercent: 100
serviceAccount:
  annotations: {}
  labels: {}
  name: null
imagePullSecrets: []
volumes: []
env: []
volumeMounts: []
rbac:
  serviceAccounts: []