{{- if .Values.deprecationWarnings.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: dpf-deprecation-dpus
  labels:
    app.kubernetes.io/part-of: dpf-operator-controller-manager
    dpu.nvidia.com/deprecation-warning: "true"
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: ["provisioning.dpu.nvidia.com"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["dpus"]
  validations:
    - expression: "!has(object.spec.bmcIP)"
      message: >-
        spec.bmcIP is deprecated. Use BMCIP from DPUDevice instead.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: dpf-deprecation-dpus-binding
  labels:
    app.kubernetes.io/part-of: dpf-operator-controller-manager
    dpu.nvidia.com/deprecation-warning: "true"
spec:
  policyName: dpf-deprecation-dpus
  validationActions: [Warn]
{{- end }}
