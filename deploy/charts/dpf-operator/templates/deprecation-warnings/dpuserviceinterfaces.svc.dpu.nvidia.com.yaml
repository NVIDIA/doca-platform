{{- if .Values.deprecationWarnings.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: dpf-deprecation-dpuserviceinterfaces
  labels:
    app.kubernetes.io/part-of: dpf-operator-controller-manager
    dpu.nvidia.com/deprecation-warning: "true"
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: ["svc.dpu.nvidia.com"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["dpuserviceinterfaces"]
  validations:
    - expression: "!has(object.spec.clusterSelector)"
      message: >-
        spec.clusterSelector is deprecated. This field is deprecated and will be removed with v26.7.0. Use DPUClusterSelector instead.
    - expression: "!has(object.spec.template) || !has(object.spec.template.spec) || !has(object.spec.template.spec.template) || !has(object.spec.template.spec.template.spec) || !has(object.spec.template.spec.template.spec.ovn)"
      message: >-
        spec.template.spec.template.spec.ovn is deprecated. This field is deprecated and will be removed with v26.10.0. Migrate to interfaceType="patch" with spec.patch.peerBridge and spec.patch.peerPatchName instead.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: dpf-deprecation-dpuserviceinterfaces-binding
  labels:
    app.kubernetes.io/part-of: dpf-operator-controller-manager
    dpu.nvidia.com/deprecation-warning: "true"
spec:
  policyName: dpf-deprecation-dpuserviceinterfaces
  validationActions: [Warn]
{{- end }}
