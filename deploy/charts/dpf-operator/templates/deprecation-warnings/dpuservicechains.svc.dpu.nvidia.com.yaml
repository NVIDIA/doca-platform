{{- if .Values.deprecationWarnings.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: dpf-deprecation-dpuservicechains
  labels:
    app.kubernetes.io/part-of: dpf-operator-controller-manager
    dpu.nvidia.com/deprecation-warning: "true"
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: ["svc.dpu.nvidia.com"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["dpuservicechains"]
  validations:
    - expression: "!has(object.spec.clusterSelector)"
      message: >-
        spec.clusterSelector is deprecated. This field is deprecated and will be removed with v26.7.0. Use DPUClusterSelector instead.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: dpf-deprecation-dpuservicechains-binding
  labels:
    app.kubernetes.io/part-of: dpf-operator-controller-manager
    dpu.nvidia.com/deprecation-warning: "true"
spec:
  policyName: dpf-deprecation-dpuservicechains
  validationActions: [Warn]
{{- end }}
