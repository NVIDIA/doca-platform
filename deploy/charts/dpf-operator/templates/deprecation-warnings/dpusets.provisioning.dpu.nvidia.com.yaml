{{- if .Values.deprecationWarnings.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: dpf-deprecation-dpusets
  labels:
    app.kubernetes.io/part-of: dpf-operator-controller-manager
    dpu.nvidia.com/deprecation-warning: "true"
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: ["provisioning.dpu.nvidia.com"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["dpusets"]
  validations:
    - expression: "!has(object.spec.dpuSelector)"
      message: >-
        spec.dpuSelector is deprecated. This field is deprecated and will be removed with v26.7.0. Use DPUDeviceSelector instead.
    - expression: "!has(object.spec.strategy) || !has(object.spec.strategy.rollingUpdate) || !has(object.spec.strategy.rollingUpdate.maxUnavailable)"
      message: >-
        spec.strategy.rollingUpdate.maxUnavailable is deprecated. This field is deprecated and will be removed with v26.7.0.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: dpf-deprecation-dpusets-binding
  labels:
    app.kubernetes.io/part-of: dpf-operator-controller-manager
    dpu.nvidia.com/deprecation-warning: "true"
spec:
  policyName: dpf-deprecation-dpusets
  validationActions: [Warn]
{{- end }}
