# -- controllerManager configures the DPF Operator controller Deployment.
controllerManager:
  # -- containerSecurityContext sets the securityContext applied to the controller container.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  # -- podSecurityContext sets the pod-level securityContext for the controller Pod.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
  # -- image overrides the controller container image. Defaults to the image baked into the chart release when left empty.
  image:
    repository: ""
    tag: ""
  # -- pullPolicy is the imagePullPolicy used for the controller container.
  pullPolicy: IfNotPresent
  # -- replicas is the number of controller Pods to run.
  replicas: 1
  # featureGates is a map of feature names to boolean values forwarded
  # to the dpf-operator and dependant controller deployments.
  # Supported features:
  #   NSIPathForSFC (default: false, alpha)
  #     When enabled, SFC ServiceInterfaceSets (those without a virtualNetwork)
  #     use the NodeServiceInterfaces reconciliation path instead of creating
  #     individual ServiceInterface objects per node.
  #   NSIPathForVPC (default: false, alpha)
  #     When enabled, VPC ServiceInterfaceSets (those with a virtualNetwork set)
  #     use the NodeServiceInterfaces reconciliation path instead of creating
  #     individual ServiceInterface objects per node.
  #   ConfigPortsOverHighSpeed (default: false, alpha)
  #     When enabled, the dpuservice controller configures configPorts over high-speed network.
  #     Applicable only when OVN-Kubernetes is used.
  #   Example:
  #     featureGates:
  #       ConfigPortsOverHighSpeed: true
  # -- featureGates configures the feature gates for the dpf-operator.
  featureGates: {}
  # Set kubernetes resource requests and limits for the controller.
  # resources:
  #   limits:
  #     cpu:
  #     memory:
  #   requests:
  #     cpu:
  #     memory:
  # -- serviceAccount configures the controller ServiceAccount.
  serviceAccount:
    # -- annotations added to the controller ServiceAccount (e.g. for cloud workload identity).
    annotations: {}
# -- imagePullSecrets is a list of Secret references used to pull controller and component images from private registries.
imagePullSecrets: []
# -- affinity controls scheduling of the controller Pod. Defaults pin the controller to control-plane nodes.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: "node-role.kubernetes.io/master"
              operator: Exists
        - matchExpressions:
            - key: "node-role.kubernetes.io/control-plane"
              operator: Exists
# -- tolerations applied to the controller Pod. Defaults allow scheduling on tainted control-plane nodes.
tolerations:
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
# -- deprecationWarnings enables ValidatingAdmissionPolicies that warn users
# when they set deprecated fields on DPF custom resources.
# Warnings are non-blocking and appear in kubectl output.
deprecationWarnings:
  enabled: true
# -- enableNodeFeatureRules decides whether additional NodeFeatureRules for DPF will be created.
# Note: NFD must be installed to support this.
enableNodeFeatureRules: true
# -- IsOpenShift templates resources - for example ClusterRoleBindings to SecurityContextConstraints - which are relevant
# when installing DPF using helm on OpenShift.
isOpenshift: false
# -- kubeStateMetricsCRDMetrics enables the kube-state-metrics custom resource state metrics.
# This is used to collect metrics for custom resources defined by the DPF Operator.
kubeStateMetricsCRDMetrics:
  enabled: true
  ## -- namespaceOverride allows to override the namespace where the customresourcestate ConfigMap is deployed.
  ## Defaults to the release namespace. Set this if the kube-state-metrics Pod that mounts the ConfigMap
  ## runs in a different namespace.
  namespaceOverride: ""
# -- grafanaDashboards enables the Grafana dashboards for the DPF Operator.
grafanaDashboards:
  enabled: true
# -- prometheusSecureMetrics enables the secure metrics endpoint for Prometheus.
# This is used to expose metrics securely for Prometheus scraping.
prometheusSecureMetrics:
  enabled: true
# -- kamajiEtcdDefrag enables the etcd-defrag job for Kamaji.
# This job is used to defragment the etcd database used by Kamaji.
kamajiEtcdDefrag:
  # -- namespaceOverride allows to override the namespace where the etcd-defrag job will be deployed.
  namespaceOverride: ""
  # -- enabled toggles the etcd-defrag CronJob.
  enabled: true
  # -- releaseName is the name of the kamaji-etcd release name.
  # If it is deployed by the kamaji chart itself it will be "kamaji-etcd".
  releaseName: kamaji-etcd
  # -- The replica count of the etcd cluster.
  replicas: 3
  # -- The client port of the etcd cluster.
  clientPort: 2379
  # -- The schedule for the etcd-defrag job.
  schedule: 0 0 * * *
  # -- image is the container image used by the etcd-defrag CronJob.
  image: ghcr.io/ahrtr/etcd-defrag:v0.22.0@sha256:a7424de0a437f54d7565e96f8a50913e0ace05398bb5c10a77d5af5fc9bf9301
  # -- The image pull policy for the etcd-defrag job.
  pullPolicy: IfNotPresent
  # -- The defrag rule for the etcd-defrag job.
  # See: https://github.com/ahrtr/etcd-defrag?tab=readme-ov-file#defragmentation-rule
  defragRule: "dbQuotaUsage > 0.8 || dbSize - dbSizeInUse > 200*1024*1024"
  # -- Keep only the X recent successful jobs.
  successfulJobsHistoryLimit: 3
  # -- Limit the number of retries on failure
  backoffLimit: 6
  # -- Set kubernetes resource requests and limits for the etcd-defrag job.
  # resources:
  #   limits:
  #     cpu: 100m
  #     memory: 64Mi
  #   requests:
  #     cpu: 200m
  #     memory: 256Mi
