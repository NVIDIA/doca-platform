- groupVersionKind:
    group: storage.dpu.nvidia.com
    kind: DPUVolume
    version: v1alpha1
  labelsFromPath:
    name:
      - metadata
      - name
    namespace:
      - metadata
      - namespace
    uid:
      - metadata
      - uid
  metricNamePrefix: dpuvolume
  metrics:
    - name: created
      help: Unix creation timestamp.
      each:
        gauge:
          path:
            - metadata
            - creationTimestamp
        type: Gauge
    - name: info
      help: Information about a DPUVolume.
      each:
        type: Info
        info:
          labelsFromPath:
            storage_policy_name:
              - spec
              - dpuStoragePolicyName
            volume_mode:
              - spec
              - volumeMode
    - name: status_phase
      help: The DPUVolume current phase.
      each:
        stateSet:
          labelName: phase
          list:
            - Pending
            - Bound
          path:
            - status
            - phase
        type: StateSet
    - name: status_conditions
      help: The condition of a DPUVolume.
      each:
        stateSet:
          labelName: status
          labelsFromPath:
            type:
              - type
          list:
            - 'True'
            - 'False'
            - Unknown
          path:
            - status
            - conditions
          valueFrom:
            - status
        type: StateSet
    - name: status_condition_last_transition_time
      help: The condition last transition time of a DPUVolume.
      each:
        gauge:
          nilIsZero: true
          labelsFromPath:
            type:
              - type
            status:
              - status
          path:
            - status
            - conditions
          valueFrom:
            - lastTransitionTime
        type: Gauge
