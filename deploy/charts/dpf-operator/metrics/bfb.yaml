- groupVersionKind:
    group: provisioning.dpu.nvidia.com
    kind: BFB
    version: v1alpha1
  labelsFromPath:
    name:
      - metadata
      - name
    namespace:
      - metadata
      - namespace
    uid:
      - metadata
      - uid
  metricNamePrefix: dpf_bfb
  metrics:
    - name: created
      help: Unix creation timestamp.
      each:
        gauge:
          path:
            - metadata
            - creationTimestamp
        type: Gauge
    - name: info
      help: Information about a BFB.
      each:
        type: Info
        info:
          labelsFromPath:
            name:
              - metadata
              - name
            version_bsp:
              - status
              - versions
              - bsp
            version_doca:
              - status
              - versions
              - doca
            version_uefi:
              - status
              - versions
              - uefi
            version_atf:
              - status
              - versions
              - atf
            file_name:
              - status
              - fileName
    - name: status_phase
      help: The BFBs current phase.
      each:
        stateSet:
          labelName: phase
          list:
            - Initializing
            - Downloading
            - Ready
            - Deleting
            - Error
          path:
            - status
            - phase
        type: StateSet
