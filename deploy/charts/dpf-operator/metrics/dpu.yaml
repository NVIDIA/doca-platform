- groupVersionKind:
    group: provisioning.dpu.nvidia.com
    kind: DPU
    version: v1alpha1
  labelsFromPath:
    name:
      - metadata
      - name
    namespace:
      - metadata
      - namespace
    uid:
      - metadata
      - uid
  metricNamePrefix: dpu
  metrics:
    - name: created
      help: Unix creation timestamp.
      each:
        gauge:
          path:
            - metadata
            - creationTimestamp
        type: Gauge
    - name: info
      help: Information about a DPU.
      each:
        type: Info
        info:
          labelsFromPath:
            dpunode_name:
              - spec
              - dpuNodeName
            dpudevice_name:
              - spec
              - dpuDeviceName
            dpf_version:
              - status
              - dpfVersion
            bfb_version:
              - status
              - bfbVersion
            pci_device:
              - status
              - pciDevice
            firmware_bmc:
              - status
              - firmware
              - bmc
            firmware_nic:
              - status
              - firmware
              - nic
            firmware_uefi:
              - status
              - firmware
              - uefi
            dpu_type:
              - status
              - dpuType
            dpu_mode:
              - status
              - dpuMode
            node_name:
              - spec
              - nodeName
    - name: required_reset
      help: Whether the DPU requires a reset.
      each:
        type: Gauge
        gauge:
          nilIsZero: true
          path:
            - status
            - requiredReset
    - name: status_phase
      help: The DPUs current phase.
      each:
        stateSet:
          labelName: phase
          list:
            - Initializing
            - Pending
            - Update Firmware
            - Config FW Parameters
            - Prepare BFB
            - Node Effect
            - Initialize Interface
            - OS Installing
            - DPU Config
            - DPU Cluster Config
            - Host Network Configuration
            - Checking Host Reboot Required
            - Node Effect Removal
            - Ready
            - Error
            - Deleting
            - Rebooting
            - Perform ARM Force Restart
          path:
            - status
            - phase
        type: StateSet
    - name: status_conditions
      help: The condition of a DPU.
      each:
        stateSet:
          labelName: status
          labelsFromPath:
            type:
              - type
          list:
            - 'True'
            - 'False'
            - Unknown
          path:
            - status
            - conditions
          valueFrom:
            - status
        type: StateSet
    - name: status_condition_last_transition_time
      help: The condition last transition time of a DPU.
      each:
        gauge:
          nilIsZero: true
          labelsFromPath:
            type:
              - type
            status:
              - status
          path:
            - status
            - conditions
          valueFrom:
            - lastTransitionTime
        type: Gauge
    - name: operational_conditions
      help: The operational condition of a DPU.
      each:
        stateSet:
          labelName: status
          labelsFromPath:
            type:
              - type
          list:
            - 'True'
            - 'False'
            - Unknown
          path:
            - status
            - operationalConditions
          valueFrom:
            - status
        type: StateSet
    - name: operational_condition_last_transition_time
      help: The operational condition last transition time of a DPU.
      each:
        gauge:
          nilIsZero: true
          labelsFromPath:
            type:
              - type
            status:
              - status
          path:
            - status
            - operationalConditions
          valueFrom:
            - lastTransitionTime
        type: Gauge
    - name: agent_conditions
      help: The agent condition of a DPU.
      each:
        stateSet:
          labelName: status
          labelsFromPath:
            type:
              - type
          list:
            - 'True'
            - 'False'
            - Unknown
          path:
            - status
            - agentStatus
            - conditions
          valueFrom:
            - status
        type: StateSet
    - name: agent_condition_last_transition_time
      help: The agent condition last transition time of a DPU.
      each:
        gauge:
          nilIsZero: true
          labelsFromPath:
            type:
              - type
            status:
              - status
          path:
            - status
            - agentStatus
            - conditions
          valueFrom:
            - lastTransitionTime
        type: Gauge
    - name: outdated_timestamp
      help: Unix timestamp at which dpu.status.outdated was first observed for the current reason. The sample is only emitted while the DPU is outdated.
      each:
        gauge:
          labelsFromPath:
            reason:
              - status
              - outdated
              - reason
          path:
            - status
            - outdated
            - timeStamp
        type: Gauge
    - name: outdated_reason
      help: The drift reason reported on dpu.status.outdated.
      each:
        stateSet:
          labelName: reason
          list:
            - OutdatedBFB
            - OutdatedDPUFlavor
            - OutdatedSecureBoot
            - OutdatedBlueFieldSoftware
          path:
            - status
            - outdated
            - reason
        type: StateSet
