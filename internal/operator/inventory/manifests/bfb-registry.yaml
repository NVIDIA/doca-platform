apiVersion: v1
data:
  nginx.conf: |-
    error_log  /dev/stderr notice;

    worker_processes  auto;

    events {
        worker_connections  1024;
    }

    pid /nginx/nginx.pid;

    http {
        include       /usr/local/nginx/conf/mime.types;
        default_type  application/octet-stream;

        # Set all temp paths to use /nginx directory
        client_body_temp_path /nginx/client_body;
        proxy_temp_path /nginx/proxy;
        fastcgi_temp_path /nginx/fastcgi;
        uwsgi_temp_path /nginx/uwsgi;
        scgi_temp_path /nginx/scgi;

        log_format  main  '$remote_addr - $remote_user [$time_local] "$request" $status '
                          'body_bytes_sent=$body_bytes_sent content_length=$sent_http_content_length '
                          'completion=[$request_completion] request_time=$request_time';
        log_format  tls   '$remote_addr - $remote_user [$time_local] "$request" $status '
                          'body_bytes_sent=$body_bytes_sent content_length=$sent_http_content_length '
                          'completion=[$request_completion] request_time=$request_time '
                          'proto=$ssl_protocol cipher=$ssl_cipher';
        access_log  /dev/stdout  main;

        sendfile        on;
        keepalive_timeout  65;

        server {
            listen       ${NGINX_HTTPS_PORT} ssl;
            server_name  _;

            ssl_certificate     /etc/bfb-registry/tls/tls.crt;
            ssl_certificate_key /etc/bfb-registry/tls/tls.key;
            ssl_protocols       TLSv1.2 TLSv1.3;
            # TLS 1.2 fallback ciphers: explicit ECDHE+AEAD allowlist, matching the Redfish client
            # policy in TLSRedfishCipherSuites.
            # TLS 1.3 suites are negotiated separately and safe by default.
            ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
            ssl_prefer_server_ciphers on;

            location / {
                root   html;
                index  index.html index.htm;
            }

            location /bfb {
                # BFB downloads are the only requests served to a BMC, whose TLS client
                # is not otherwise observable; log the negotiated protocol and suite here.
                access_log /dev/stdout tls;
                root /;
                concat on;
                concat_max_files 20;
                concat_types application/octet-stream;
                concat_types *;
                concat_unique off;
            }

            # APT package repository (.deb)
            location /deb {
                root /;
                autoindex on;
                types {
                    text/plain                          Packages;
                    application/gzip                    gz;
                    application/vnd.debian.binary-package deb;
                }
            }

            # YUM/DNF package repository (.rpm)
            location /rpm {
                root /;
                autoindex on;
                types {
                    application/x-rpm                   rpm;
                    application/xml                     xml;
                    application/gzip                    gz;
                }
            }
        }
    }
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/part-of: bfb-registry
    dpu.nvidia.com/component: bfb-registry
  name: bfb-registry-config
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/part-of: bfb-registry
    dpu.nvidia.com/component: bfb-registry
  name: bfb-registry
spec:
  ports:
  - name: https
    port: 8443
    targetPort: 8443
  selector:
    app.kubernetes.io/part-of: bfb-registry
    dpu.nvidia.com/component: bfb-registry
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/part-of: bfb-registry
    dpu.nvidia.com/component: bfb-registry
  name: bfb-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/part-of: bfb-registry
      dpu.nvidia.com/component: bfb-registry
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: bfb-registry
        dpu.nvidia.com/component: bfb-registry
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/part-of: bfb-registry
                  dpu.nvidia.com/component: bfb-registry
              topologyKey: kubernetes.io/hostname
            weight: 100
      containers:
      - command:
        - /bin/sh
        - -c
        - envsubst '${NGINX_HTTPS_PORT}' < /nginx/nginx.conf.template > /nginx/nginx.conf
          && /usr/local/nginx/sbin/nginx -c /nginx/nginx.conf -g "daemon off;"
        env:
        - name: NGINX_HTTPS_PORT
          value: "8443"
        image: example.com/bfb-registry:v0.1.0
        name: bfb-registry
        ports:
        - containerPort: 8443
          name: https
        securityContext:
          privileged: true
          runAsGroup: 65532
          runAsUser: 65532
        volumeMounts:
        - mountPath: /bfb
          name: bfb
          readOnly: true
        - mountPath: /nginx/nginx.conf.template
          name: config
          readOnly: true
          subPath: nginx.conf
        - mountPath: /nginx
          name: nginx-tmp
        - mountPath: /etc/bfb-registry/tls
          name: server-cert
          readOnly: true
      - command:
        - /usr/local/bin/certreloader
        - -cert-dir
        - /etc/bfb-registry/tls
        - -nginx-bin
        - /usr/local/nginx/sbin/nginx
        - -nginx-conf
        - /nginx/nginx.conf
        image: example.com/bfb-registry:v0.1.0
        name: cert-reloader
        securityContext:
          appArmorProfile:
            type: Unconfined
          runAsGroup: 65532
          runAsUser: 65532
        volumeMounts:
        - mountPath: /nginx
          name: nginx-tmp
        - mountPath: /etc/bfb-registry/tls
          name: server-cert
          readOnly: true
      securityContext:
        fsGroup: 65532
      shareProcessNamespace: true
      terminationGracePeriodSeconds: 0
      volumes:
      - configMap:
          name: bfb-registry-config
        name: config
      - emptyDir: {}
        name: nginx-tmp
      - name: server-cert
        secret:
          defaultMode: 288
          optional: false
          secretName: bfb-registry-server-cert
      - name: bfb
        persistentVolumeClaim:
          claimName: bfb-pvc
          readOnly: true
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    app.kubernetes.io/part-of: bfb-registry
    dpu.nvidia.com/component: bfb-registry
  name: bfb-registry-server-cert
spec:
  commonName: bfb-registry
  dnsNames:
  - bfb-registry.dpf-operator-system.svc
  duration: 2160h
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: dpf-platform-issuer
  privateKey:
    algorithm: ECDSA
    size: 256
  renewBefore: 720h
  secretName: bfb-registry-server-cert
  usages:
  - server auth
  - digital signature
  - key encipherment
