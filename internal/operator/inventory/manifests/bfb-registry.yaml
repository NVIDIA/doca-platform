apiVersion: v1
data:
  nginx.conf: |
    error_log  /dev/stderr notice;

    load_module /usr/local/nginx/modules/ngx_http_concat_module.so;

    worker_processes  auto;

    events {
        worker_connections  1024;
    }

    pid /nginx/nginx.pid;

    http {
        include       /usr/local/nginx/conf/mime.types;
        default_type  application/octet-stream;

        # Set all temp paths to use /nginx directory
        client_body_temp_path /nginx/client_body;
        proxy_temp_path /nginx/proxy;
        fastcgi_temp_path /nginx/fastcgi;
        uwsgi_temp_path /nginx/uwsgi;
        scgi_temp_path /nginx/scgi;

        log_format  main  '$remote_addr - $remote_user [$time_local] "$request" $status';
        access_log  /dev/stdout  main;

        sendfile        on;
        keepalive_timeout  65;

        server {
            listen       ${NGINX_PORT};
            server_name  _;

            location / {
                root   html;
                index  index.html index.htm;
            }

            location /bfb {
                root /;
                concat on;
                concat_max_files 20;
                concat_types application/octet-stream;
                concat_types *;
                concat_unique off;
            }

            # APT package repository (.deb)
            location /deb {
                root /;
                autoindex on;
                types {
                    text/plain                          Packages;
                    application/gzip                    gz;
                    application/vnd.debian.binary-package deb;
                }
            }

            # YUM/DNF package repository (.rpm)
            location /rpm {
                root /;
                autoindex on;
                types {
                    application/x-rpm                   rpm;
                    application/xml                     xml;
                    application/gzip                    gz;
                }
            }
        }
    }
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/part-of: bfb-registry
    dpu.nvidia.com/component: bfb-registry
  name: bfb-registry-config
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/part-of: bfb-registry
    dpu.nvidia.com/component: bfb-registry
  name: bfb-registry
spec:
  ports:
  - port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app.kubernetes.io/part-of: bfb-registry
    dpu.nvidia.com/component: bfb-registry
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/part-of: bfb-registry
    dpu.nvidia.com/component: bfb-registry
  name: bfb-registry
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: bfb-registry
      dpu.nvidia.com/component: bfb-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: bfb-registry
        dpu.nvidia.com/component: bfb-registry
    spec:
      containers:
      - command:
        - /bin/sh
        - -c
        - envsubst '$NGINX_PORT' < /nginx/nginx.conf.template > /nginx/nginx.conf
          && /usr/local/nginx/sbin/nginx -c /nginx/nginx.conf -g "daemon off;"
        env:
        - name: NGINX_PORT
          value: "8080"
        image: example.com/bfb-registry:v0.1.0
        name: nginx
        volumeMounts:
        - mountPath: /nginx/nginx.conf.template
          name: bfb-registry-config
          subPath: nginx.conf
        - mountPath: /bfb
          name: bfb-volume
      hostNetwork: true
      volumes:
      - configMap:
          name: bfb-registry-config
        name: bfb-registry-config
      - name: bfb-volume
        persistentVolumeClaim:
          claimName: bfb-pvc
