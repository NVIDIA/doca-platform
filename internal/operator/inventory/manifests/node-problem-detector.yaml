apiVersion: svc.dpu.nvidia.com/v1alpha1
kind: DPUService
metadata:
  name: node-problem-detector
  namespace: dpf-operator-system
spec:
  security:
    # The node-problem-detector runs unprivileged: its checks only read the
    # host sysfs, /proc process metadata (hostPID) and the persistent journal.
    # With this set to false the DPUCluster admission policy rejects any
    # privileged node-problem-detector pod.
    privileged: false
  helmChart:
    source:
      repoURL: oci://example.com
      chart: node-problem-detector-chart
      version: v0.1.0
