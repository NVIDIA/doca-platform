name: spiffe-helper
arch: arm64
version: "${VERSION}"
maintainer: NVIDIA DPF Team <dpf@nvidia.com>
description: |
  DSX SPIFFE Helper for DPU Agent authentication.
  Writes SPIRE JWT-SVIDs directly or after RFC 8693 token exchange.
vendor: NVIDIA
license: Apache-2.0
section: admin
priority: optional

contents:
  - src: ./spiffe-helper
    dst: /usr/bin/spiffe-helper
    file_info:
      mode: 0755

  - src: ./spiffe-helper.service
    dst: /usr/lib/systemd/system/spiffe-helper.service
    file_info:
      mode: 0644
