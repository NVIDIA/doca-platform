apiVersion: svc.dpu.nvidia.com/v1alpha1
kind: DPUService
metadata:
  name: vpc-ovn-controller
  namespace: dpf-operator-system
spec:
  serviceID: vpc-ovn-controller
  deployInCluster: true
  helmChart:
    source:
      repoURL: oci://example.com/chart
      version: v0.1.0
      chart: dpf-vpc-ovn
    values:
      host:
        vpcOVNController:
          enabled: true
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: "node-role.kubernetes.io/master"
                    operator: Exists
                - matchExpressions:
                  - key: "node-role.kubernetes.io/control-plane"
                    operator: Exists
