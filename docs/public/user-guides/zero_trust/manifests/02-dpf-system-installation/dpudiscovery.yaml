---
apiVersion: provisioning.dpu.nvidia.com/v1alpha1
kind: DPUDiscovery
metadata:
  name: dpu-discovery
  namespace: dpf-operator-system
spec:
  # Define the IP range to scan
  ipRangeSpec:
    ipRange:
      startIP: $IP_RANGE_START
      endIP:   $IP_RANGE_END
  
  # Optional: Set scan interval
  scanInterval: "60m"